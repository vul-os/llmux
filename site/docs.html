</button>

<script>
// The site is served from the repo root; docs render straight from the repo's
// own markdown. `group` orders the thirteen files into the reader's journey —
// start, understand the system, look things up, run it, follow the project —
// and that order is also the prev/next path through the set.
const GROUPS = [
  { n:'01', label:'Start'     },
  { n:'02', label:'Embed'     },
  { n:'03', label:'System'    },
  { n:'04', label:'Reference' },
  { n:'05', label:'Operate'   },
  { n:'06', label:'Project'   }
];
const DOCS = [
  {"slug":"getting-started","title":"Getting started","path":"./docs/getting-started.md","group":0},
  {"slug":"quickstarts","title":"Quickstarts","path":"./docs/quickstarts.md","group":0},
  {"slug":"client-examples","title":"Client examples","path":"./docs/client-examples.md","group":0},
  {"slug":"choosing-a-mode","title":"Choosing a mode","path":"./docs/choosing-a-mode.md","group":1},
  {"slug":"embedding","title":"Embedding in Go","path":"./docs/embedding.md","group":1},
  {"slug":"c-abi","title":"The C ABI","path":"./docs/c-abi.md","group":1},
  {"slug":"sdks","title":"Language packages","path":"./docs/sdks.md","group":1},
  {"slug":"architecture","title":"Architecture","path":"./docs/architecture.md","group":2},
  {"slug":"configuration","title":"Configuration","path":"./docs/configuration.md","group":2},
  {"slug":"control-plane","title":"Control-plane seam","path":"./docs/control-plane.md","group":2},
  {"slug":"api","title":"API reference","path":"./docs/api.md","group":3},
  {"slug":"llm-access","title":"LLM access & BYOK","path":"./docs/llm-access.md","group":3},
  {"slug":"parity","title":"Provider parity","path":"./docs/parity.md","group":3},
  {"slug":"admin-guide","title":"Admin guide","path":"./docs/admin-guide.md","group":4},
  {"slug":"operations","title":"Operations","path":"./docs/operations.md","group":4},
  {"slug":"troubleshooting","title":"Troubleshooting","path":"./docs/troubleshooting.md","group":4},
  {"slug":"roadmap","title":"Roadmap","path":"./docs/roadmap.md","group":5},
  {"slug":"changelog","title":"Changelog","path":"./docs/changelog.md","group":5}
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const byFile = Object.fromEntries(DOCS.map(d=>[d.path.split('/').pop().toLowerCase(),d]));
const idxOf  = Object.fromEntries(DOCS.map((d,i)=>[d.slug,i]));
const content   = document.getElementById('content');
const docRail   = document.getElementById('docRail');
const navBody   = document.getElementById('navBody');
const docFoot   = document.getElementById('docFoot');
const tocRail   = document.getElementById('tocRail');
const tocListEl = document.getElementById('tocList');
const pad2 = n => String(n).padStart(2,'0');
let mermaidReady = false;

// edgeLabelBackground: mermaid's own dark-theme default (a mid-grey chip
// behind e.g. "yes"/"no" edge labels) measured 4.43:1 against its #ccc label
// text — under the 4.5:1 AA floor by a hair. #505050 clears ~5.0:1 without
// otherwise touching the palette.
try { mermaid.initialize({ startOnLoad:false, theme:'dark', securityLevel:'loose', themeVariables:{ fontFamily:'var(--sans)', edgeLabelBackground:'#505050' } }); mermaidReady = true; } catch(e){}

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- The document index ----------------------------------------------
// Built once from DOCS: six numbered groups, one ordinal per document. Groups
// collapse and remember it; the ACTIVE document alone expands to its own
// sections (see buildNavSub, called once the page has rendered).
const CHEVRON = '<svg class="gt" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
  'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

// Collapsed groups persist per group label rather than per index, so inserting
// a group at the front does not silently shuffle everyone's saved state onto
// the wrong chapters.
const GRP_KEY = 'llmux-docs-groups-shut';
function shutGroups(){
  try { return new Set(JSON.parse(localStorage.getItem(GRP_KEY) || '[]')); } catch(e){ return new Set(); }
}
function saveShutGroups(set){
  try { localStorage.setItem(GRP_KEY, JSON.stringify([...set])); } catch(e){}
}

function buildIndexNav(){
  const shut = shutGroups();
  let html = '';
  GROUPS.forEach((g, gi)=>{
    const members = DOCS.map((d,i)=>({d,i})).filter(x=>x.d.group===gi);
    if(!members.length) return;
    const isShut = shut.has(g.label);
    const listId = 'navgrp-' + gi;
    html += '<div class="nav-grp'+(isShut?' shut':'')+'" data-group="'+esc(g.label)+'">'+
            '<button class="nav-grp-h" type="button" aria-expanded="'+(isShut?'false':'true')+'" '+
              'aria-controls="'+listId+'">'+
              '<span class="gn">'+g.n+'</span>'+
              '<span class="gl">'+esc(g.label)+'</span>'+
              '<span class="gr"></span>'+
              '<span class="gc">'+members.length+'</span>'+
              CHEVRON+
            '</button>'+
            '<ul class="nav-list" id="'+listId+'">';
    members.forEach(({d,i})=>{
      html += '<li><a class="nav-item" data-slug="'+d.slug+'" href="#'+d.slug+'">'+
              '<span class="pg" aria-hidden="true"></span>'+
              '<span class="ix">'+pad2(i+1)+'</span><span class="nm">'+esc(d.title)+'</span></a></li>';
    });
    html += '</ul></div>';
  });
  navBody.innerHTML = html;
  const count = document.getElementById('railCount');
  if (count) count.textContent = DOCS.length + ' files';
}
buildIndexNav();

function setGroupOpen(grp, open, persist){
  const btn = grp.querySelector('.nav-grp-h');
  grp.classList.toggle('shut', !open);
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (!persist) return;
  const set = shutGroups();
  if (open) set.delete(grp.dataset.group); else set.add(grp.dataset.group);
  saveShutGroups(set);
}
navBody.addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-grp-h');
  if (!btn) return;
  const grp = btn.closest('.nav-grp');
  setGroupOpen(grp, grp.classList.contains('shut'), true);
});

// ---- Rail scroll position across page loads --------------------------
// Reading a set of eighteen documents means coming back to this index over and
// over. Losing your place in it on every navigation is a small tax charged
// every single time. sessionStorage, not local: it is a position inside one
// reading session, not a preference.
const RAIL_SCROLL_KEY = 'llmux-docs-rail-scroll';
let railScrollTick = false;
function rememberRailScroll(){
  railScrollTick = false;
  const body = document.getElementById('railBody');
  if (!body) return;
  try { sessionStorage.setItem(RAIL_SCROLL_KEY, String(body.scrollTop)); } catch(e){}
}
function restoreRailScroll(){
  const body = document.getElementById('railBody');
  if (!body) return;
  let v = null;
  try { v = sessionStorage.getItem(RAIL_SCROLL_KEY); } catch(e){}
  if (v === null) return;
  const n = parseFloat(v);
  if (!isNaN(n) && n > 0) body.scrollTop = n;
}
(function(){
  const body = document.getElementById('railBody');
  if (!body) return;
  body.addEventListener('scroll', ()=>{
    if (railScrollTick) return;
    railScrollTick = true;
    requestAnimationFrame(rememberRailScroll);
  }, {passive:true});
  restoreRailScroll();
})();

function setActive(slug){
  navBody.querySelectorAll('a[data-slug]').forEach(a=>{
    if (a.dataset.slug === slug) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  const doc = bySlug[slug];
  const i = idxOf[slug];
  const cur = document.getElementById('navCurrent');
  const ix  = document.getElementById('navIndex');
  if (doc && cur) cur.textContent = doc.title;
  if (doc && ix)  ix.textContent = pad2(i+1)+'/'+pad2(DOCS.length);
  const active = navBody.querySelector('a[aria-current="page"]');
  // An index that hides the page you are on is worse than a long one: opening
  // the active document's group is not negotiable, and it persists, because a
  // reader who navigated here plainly wants this chapter.
  if (active){
    const grp = active.closest('.nav-grp');
    if (grp && grp.classList.contains('shut')) setGroupOpen(grp, true, true);
  }
  // The index can outrun a short viewport, so make sure the entry that says
  // which document you are in is one of the ones actually on screen.
  const body = document.getElementById('railBody');
  if (active && body && body.scrollHeight > body.clientHeight + 2){
    const nb = body.getBoundingClientRect(), ab = active.getBoundingClientRect();
    if (ab.top < nb.top + 60) body.scrollTop -= (nb.top + 60 - ab.top);
    else if (ab.bottom > nb.bottom - 12) body.scrollTop += (ab.bottom - nb.bottom + 12);
  }
}

// slugify mirrors GitHub's heading-anchor algorithm closely enough that the
// anchors already written throughout docs/ (e.g. "#the-sovereignty-gate-
// where-your-ai-runs") match: lowercase, drop punctuation, spaces to hyphens.
function slugify(text){
  return text.toLowerCase()
    .replace(/[^\wÀ-ɏ\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-');
}

// assignHeadingIds gives every heading marked.js renders an id, so in-page and
// cross-doc "#anchor" links (which marked does not id by itself) have
// somewhere to land.
function assignHeadingIds(){
  const seen = {};
  content.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{
    let id = slugify(h.textContent);
    if(seen[id]){ seen[id]++; id = id+'-'+seen[id]; } else { seen[id] = 0; }
    h.id = id;
  });
}

function highlightCode(){
  if(!window.hljs) return;
  // Only tokenize fences with an explicit ```lang — auto-detecting on bare
  // ``` blocks (plain output, ASCII trees, etc.) risks mis-tokenizing text
  // that isn't code at all, which is worse than leaving it unhighlighted.
  content.querySelectorAll('pre code[class*="language-"]').forEach(code=>{
    // Mermaid diagrams are swapped out for a rendered <div> by renderMermaid();
    // never tokenize their source as code.
    if(code.classList.contains('language-mermaid')) return;
    try { hljs.highlightElement(code); } catch(e){ console.warn('highlight', e); }
  });
}

async function renderMermaid(){
  if(!mermaidReady) return;
  const blocks = [...content.querySelectorAll('code.language-mermaid')];
  blocks.forEach(code=>{
    const wrap = document.createElement('div');
    wrap.className = 'cb is-diagram';
    const bar = document.createElement('div');
    bar.className = 'cb-bar';
    const lang = document.createElement('span');
    lang.className = 'cb-lang';
    lang.textContent = 'Diagram';
    bar.appendChild(lang);
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    wrap.appendChild(bar); wrap.appendChild(div);
    code.closest('pre').replaceWith(wrap);
  });
  const nodes = content.querySelectorAll('.mermaid');
  if(nodes.length){ try { await mermaid.run({ nodes }); } catch(e){ console.warn('mermaid', e); } }
}

// ---- Language picker -------------------------------------------------
// Turns a run of N>=3 consecutive same-shape "one code example per
// language" blocks into a tab strip with one visible panel. Generic by
// design: it looks at DOM shape (a run of <pre><code class="language-*">
// blocks, each optionally preceded by a "**Label**" paragraph that marked
// renders immediately before its own code fence), not at any filename or
// heading text. If the shape isn't there, nothing changes and the reader
// sees the original stacked blocks — the untouched, always-safe fallback.
const LANG_META = {
  bash:       { name:'Bash',       badge:'sh'   },
  shell:      { name:'Shell',      badge:'sh'   },
  sh:         { name:'Shell',      badge:'sh'   },
  python:     { name:'Python',     badge:'py'   },
  javascript: { name:'JavaScript', badge:'js'   },
  typescript: { name:'TypeScript', badge:'ts'   },
  go:         { name:'Go',         badge:'go'   },
  ruby:       { name:'Ruby',       badge:'rb'   },
  php:        { name:'PHP',        badge:'php'  },
  java:       { name:'Java',       badge:'java' },
  csharp:     { name:'C#',         badge:'c#'   },
  rust:       { name:'Rust',       badge:'rs'   },
  cpp:        { name:'C++',        badge:'c++'  },
  c:          { name:'C',          badge:'c'    },
  swift:      { name:'Swift',      badge:'sw'   },
  kotlin:     { name:'Kotlin',     badge:'kt'   },
  elixir:     { name:'Elixir',     badge:'ex'   },
  r:          { name:'R',          badge:'r'    },
  dart:       { name:'Dart',       badge:'dart' },
  json:       { name:'JSON',       badge:'{}'   },
  jsonc:      { name:'JSON',       badge:'{}'   },
  http:       { name:'HTTP',       badge:'http' },
  yaml:       { name:'YAML',       badge:'yml'  },
  text:       { name:'Text',       badge:'txt'  },
};
function langName(lang){
  const m = LANG_META[lang];
  return m ? m.name : (lang.charAt(0).toUpperCase()+lang.slice(1));
}
function langBadge(lang){
  const m = LANG_META[lang];
  return m ? m.badge : lang.slice(0,2);
}
// Every tab carries the same hairline lettermark chip — a deliberate lettermark
// system rather than pictographic per-language logos: several of these
// languages' real marks (Java's cup, Rust's gear, PHP's elephant, Swift's bird)
// are registered trademarks, and redrawing them close enough to be recognisable
// would be reproducing someone else's logo.
//
// It used to be drawn as SVG <text> inside a fixed 16x16 viewBox, which meant
// the lettermark shrank to fit the box: 8.5px for `sh`, 7px for `c++`, 6px for
// `java` and `dart`. A 6px lettermark is not a lettermark, it is grit. It is
// real text now, set at the same 11px floor as every other label on the page,
// in a hairline box that sizes itself to the glyphs instead of the other way
// round — the page's own chip idiom, and legible at every tab size.
function makeLangIcon(lang){
  const el = document.createElement('span');
  el.className = 'lang-tab-icon';
  el.setAttribute('aria-hidden','true');
  el.textContent = langBadge(lang);
  return el;
}

// Walks content's direct children and groups them into "code items": a
// <pre><code class="language-X"> block, optionally paired with the
// immediately preceding <p><strong>…</strong>…</p> label marked.js
// renders above it. Any other element breaks the run. Only runs of
// length >= 3 are returned — shorter runs are left as plain stacked
// blocks, same as a single lone code fence.
function collectLangRuns(root){
  const kids = Array.from(root.children);
  const items = [];
  let i = 0;
  while (i < kids.length) {
    const node = kids[i];
    let labelEl = null, pre = null, codeEl = null;
    if (node.tagName === 'P' && node.firstElementChild && node.firstElementChild.tagName === 'STRONG' &&
        kids[i+1] && kids[i+1].tagName === 'PRE') {
      const nextCode = kids[i+1].querySelector(':scope > code[class*="language-"]');
      if (nextCode && !nextCode.classList.contains('language-mermaid')) {
        labelEl = node; pre = kids[i+1]; codeEl = nextCode;
      }
    }
    if (!pre && node.tagName === 'PRE') {
      const c = node.querySelector(':scope > code[class*="language-"]');
      if (c && !c.classList.contains('language-mermaid')) { pre = node; codeEl = c; }
    }
    if (pre) {
      const langClass = [...codeEl.classList].find(c => c.startsWith('language-'));
      const lang = langClass ? langClass.slice('language-'.length) : '';
      if (lang) {
        items.push({ lang, pre, codeEl, labelEl });
        i += labelEl ? 2 : 1;
        continue;
      }
    }
    items.push(null);
    i += 1;
  }
  const runs = [];
  let cur = [];
  for (const it of items) {
    if (it) cur.push(it);
    else { if (cur.length >= 3) runs.push(cur); cur = []; }
  }
  if (cur.length >= 3) runs.push(cur);
  // A run only makes sense as a picker if every block is a distinct
  // language — if the same language repeats, this isn't a "same call,
  // many languages" run, so leave it alone.
  return runs.filter(run => new Set(run.map(it=>it.lang)).size === run.length);
}

const LANG_PREF_KEY = 'llmux-docs-lang';
function getLangPref(){ try { return localStorage.getItem(LANG_PREF_KEY) || ''; } catch(e){ return ''; } }
function setLangPref(lang){ try { localStorage.setItem(LANG_PREF_KEY, lang); } catch(e){} }

// Not every run offers every language — client-examples has a 17-language run
// and a 3-language one — so the shared preference has to be checked BEFORE
// anything is deselected. Clearing first and bailing out afterwards left the
// smaller run with aria-selected="false" on every tab and tabIndex -1 on every
// tab: no tab highlighted, the strip unreachable by keyboard, and a stale panel
// still showing. A run that cannot honour the preference simply keeps its own.
function activateLangTab(picker, lang){
  const tabs = picker.querySelectorAll('.lang-tab');
  let matched = false;
  tabs.forEach(tab=>{ if (tab.dataset.lang === lang) matched = true; });
  if (!matched) return false;
  tabs.forEach(tab=>{
    const on = tab.dataset.lang === lang;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
  });
  picker.querySelectorAll('.lang-panel').forEach(p=>{
    p.classList.toggle('active', p.dataset.lang === lang);
  });
  // A tab selected in one run may be off-screen in another; bring it back.
  const strip = picker.querySelector('.lang-tabs');
  const live = picker.querySelector('.lang-tab[aria-selected="true"]');
  if (strip && live) live.scrollIntoView({block:'nearest', inline:'nearest'});
  return true;
}

function selectLangEverywhere(lang){
  setLangPref(lang);
  document.querySelectorAll('.lang-picker').forEach(p=>activateLangTab(p, lang));
}

let langPickerSeq = 0;
function buildLangPickers(){
  let runs;
  try { runs = collectLangRuns(content); } catch(e){ console.warn('lang-picker detect', e); return; }
  const preferred = getLangPref();
  runs.forEach(run=>{
    try {
      const runId = 'langrun-' + (langPickerSeq++);
      const picker = document.createElement('div');
      picker.className = 'lang-picker';

      const strip = document.createElement('div');
      strip.className = 'lang-strip';
      const tablist = document.createElement('div');
      tablist.className = 'lang-tabs';
      tablist.setAttribute('role','tablist');
      tablist.setAttribute('aria-label','Language');
      strip.appendChild(tablist);
      const edges = ()=>{
        strip.classList.toggle('more-l', tablist.scrollLeft > 2);
        strip.classList.toggle('more-r', tablist.scrollWidth - tablist.clientWidth - tablist.scrollLeft > 2);
      };
      tablist.addEventListener('scroll', edges, {passive:true});
      window.addEventListener('resize', edges);

      const panels = document.createElement('div');
      panels.className = 'lang-panels';

      const initial = run.find(it=>it.lang===preferred) ? preferred : run[0].lang;

      // Mark the run's original position *before* anything is moved — once
      // the loop below starts re-parenting label/pre nodes into panels,
      // run[0]'s node no longer has its original parent/siblings to anchor on.
      const firstNode = run[0].labelEl || run[0].pre;
      const anchor = document.createComment('lang-picker-anchor');
      firstNode.parentNode.insertBefore(anchor, firstNode);

      run.forEach(it=>{
        const tabId = runId + '-tab-' + it.lang;
        const panelId = runId + '-panel-' + it.lang;
        const selected = it.lang === initial;

        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'lang-tab';
        tab.id = tabId;
        tab.setAttribute('role','tab');
        tab.setAttribute('aria-selected', selected ? 'true':'false');
        tab.setAttribute('aria-controls', panelId);
        tab.tabIndex = selected ? 0 : -1;
        tab.dataset.lang = it.lang;
        tab.appendChild(makeLangIcon(it.lang));
        const label = document.createElement('span');
        label.textContent = langName(it.lang);
        tab.appendChild(label);
        tab.addEventListener('click', ()=>{ selectLangEverywhere(it.lang); tab.focus(); });
        tab.addEventListener('keydown', (e)=>{
          const tabs = Array.from(tablist.querySelectorAll('.lang-tab'));
          const idx = tabs.indexOf(tab);
          let next = -1;
          if (e.key === 'ArrowRight') next = (idx+1) % tabs.length;
          else if (e.key === 'ArrowLeft') next = (idx-1+tabs.length) % tabs.length;
          else if (e.key === 'Home') next = 0;
          else if (e.key === 'End') next = tabs.length - 1;
          if (next !== -1) {
            e.preventDefault();
            const t = tabs[next];
            selectLangEverywhere(t.dataset.lang);
            t.focus();
          }
        });
        tablist.appendChild(tab);

        const panel = document.createElement('div');
        panel.className = 'lang-panel' + (selected ? ' active' : '');
        panel.id = panelId;
        panel.dataset.lang = it.lang;
        panel.setAttribute('role','tabpanel');
        panel.setAttribute('aria-labelledby', tabId);
        panel.tabIndex = 0;
        if (it.labelEl) panel.appendChild(it.labelEl);
        panel.appendChild(it.pre);
        panels.appendChild(panel);
      });

      picker.appendChild(strip);
      picker.appendChild(panels);
      anchor.parentNode.insertBefore(picker, anchor);
      anchor.remove();
      const live = tablist.querySelector('.lang-tab[aria-selected="true"]');
      if (live) tablist.scrollLeft = Math.max(0, live.offsetLeft - 12);
      edges();
    } catch(e){ console.warn('lang-picker build', e); }
  });
}

// ---- Code fence chrome -----------------------------------------------
// Every fence gets a titled bar: the language on the left, a permanently
// visible COPY on the right. Runs AFTER buildLangPickers() on purpose — the
// picker re-parents <pre> nodes by walking content's direct children, and
// wrapping them first would hide every fence from that walk.
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

// Splits a highlighted <code> into one block element per SOURCE line, so each
// line can carry its own hanging indent (see the .ln rules above — text-indent
// only ever addresses the first line box of a block, so this cannot be done
// with one <pre> and a pile of newlines).
//
// It has to rebuild the open-element chain at every line break rather than just
// splitting on '\n': highlight.js emits spans that legitimately straddle a
// newline — a block comment, a multi-line string, a bash line continuation —
// and naively cutting the text would either drop those spans' colour on every
// line after the first or produce unbalanced markup.
function wrapCodeLines(codeEl){
  const open = [];               // the source spans currently open, outermost first
  const lines = [];
  let cursor = null;
  function newLine(){
    const line = document.createElement('span');
    line.className = 'ln';
    lines.push(line);
    cursor = line;
    for (const t of open){ const c = t.cloneNode(false); cursor.appendChild(c); cursor = c; }
  }
  newLine();
  (function walk(node){
    for (const child of Array.from(node.childNodes)){
      if (child.nodeType === 3){
        const parts = child.nodeValue.split('\n');
        for (let i = 0; i < parts.length; i++){
          if (i > 0) newLine();
          if (parts[i]) cursor.appendChild(document.createTextNode(parts[i]));
        }
      } else if (child.nodeType === 1){
        const clone = child.cloneNode(false);
        cursor.appendChild(clone);
        open.push(child);
        cursor = clone;
        walk(child);
        open.pop();
        // Whether or not a line broke inside this element, the element we are
        // now sitting in is this one's clone on the CURRENT line — so stepping
        // up one level is correct in both cases.
        cursor = cursor.parentNode;
      }
    }
  })(codeEl);
  while (lines.length > 1 && !lines[lines.length-1].textContent) lines.pop();
  codeEl.textContent = '';
  lines.forEach(l => codeEl.appendChild(l));
}

// A fence whose COLUMNS carry meaning — a directory tree with its comments
// aligned in a second column, a two-column request sketch — stops saying
// anything the moment it soft-wraps, so those keep white-space:pre and scroll.
// Everything else wraps. The test is deliberately about shape rather than
// filename or heading: a majority of the lines line something up in a second
// column, and the fence is untagged or tagged `text` (a fence that declared a
// real language is source code, and source code reflows fine).
function isColumnar(text, lang){
  if (lang && lang !== 'text' && lang !== 'plain' && lang !== 'plaintext') return false;
  const lines = text.replace(/\n+$/,'').split('\n').filter(l => l.trim());
  if (lines.length < 2) return false;
  const aligned = lines.filter(l => /\S {2,}\S/.test(l)).length;
  return aligned >= 2 && aligned / lines.length >= 0.6;
}

function decorateCode(){
  content.querySelectorAll('pre').forEach(pre=>{
    if (pre.parentElement && pre.parentElement.classList.contains('cb')) return;
    const code = pre.querySelector('code');
    const cls = code ? [...code.classList].find(c=>c.startsWith('language-')) : null;
    const lang = cls ? cls.slice('language-'.length) : '';
    const columnar = code ? isColumnar(code.textContent, lang) : false;
    if (code) wrapCodeLines(code);

    const wrap = document.createElement('div');
    wrap.className = 'cb' + (columnar ? ' is-columnar' : '');
    pre.parentNode.insertBefore(wrap, pre);

    const bar = document.createElement('div');
    bar.className = 'cb-bar';
    const label = document.createElement('span');
    label.className = 'cb-lang';
    label.textContent = lang ? langName(lang) : '';
    bar.appendChild(label);
    const spacer = document.createElement('span');
    spacer.className = 'cb-spacer';
    bar.appendChild(spacer);
    if (columnar){
      const note = document.createElement('span');
      note.className = 'cb-note';
      note.textContent = 'aligned · scrolls →';
      bar.appendChild(note);
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cb-copy';
    btn.innerHTML = COPY_ICON + '<span>Copy</span>';
    btn.setAttribute('aria-label','Copy code to clipboard');
    btn.addEventListener('click', async ()=>{
      const text = pre.innerText;
      let ok = true;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
        else throw new Error('no clipboard api');
      } catch(e){
        try {
          const ta = document.createElement('textarea');
          ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
        } catch(e2){ ok = false; }
      }
      btn.classList.add('done');
      btn.querySelector('span').textContent = ok ? 'Copied' : 'Press ⌘C';
      setTimeout(()=>{ btn.classList.remove('done'); btn.querySelector('span').textContent = 'Copy'; }, 1600);
    });
    bar.appendChild(btn);

    wrap.appendChild(bar);
    wrap.appendChild(pre);
  });
}

// Keeps the "there is more of this line to the right" edge honest: it is on
// while the block can still be scrolled further, and off the instant it can't.
function markColumnarScroll(){
  content.querySelectorAll('.cb.is-columnar').forEach(cb=>{
    const pre = cb.querySelector('pre');
    if (!pre) return;
    const upd = ()=>{ cb.classList.toggle('has-more', pre.scrollWidth - pre.clientWidth - pre.scrollLeft > 2); };
    pre.addEventListener('scroll', upd, {passive:true});
    window.addEventListener('resize', upd);
    upd();
  });
}

// ---- Table wrappers --------------------------------------------------
function wrapTables(){
  content.querySelectorAll('table').forEach(t=>{
    if (t.parentElement && t.parentElement.classList.contains('table-wrap')) return;
    // Carry each column's heading onto its own cells. Below 640px the table
    // reflows into one record per row (see the @media rule above) and this is
    // what lets every cell still say which column it came from.
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if (heads.length){
      t.querySelectorAll('tbody tr').forEach(tr=>{
        [...tr.children].forEach((cell,i)=>{
          if (cell.tagName === 'TD' && heads[i]) cell.setAttribute('data-h', heads[i]);
        });
      });
    }
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    wrap.tabIndex = 0;               // a scroll region has to be keyboard-scrollable
    wrap.setAttribute('role','region');
    wrap.setAttribute('aria-label','Table');
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
}

// ---- Heading anchors -------------------------------------------------
// Surfaces the deep link that already worked: "#<page>~<heading>".
function addHeadingAnchors(slug){
  content.querySelectorAll('h2,h3,h4').forEach(h=>{
    if (!h.id || h.querySelector('.h-anchor')) return;
    const a = document.createElement('a');
    a.className = 'h-anchor';
    a.href = '#' + slug + '~' + h.id;
    a.textContent = '#';
    a.setAttribute('aria-label','Link to this section: ' + h.textContent);
    h.appendChild(a);
  });
}

// ---- Where you are INSIDE the document -------------------------------
// Two surfaces, one source. The CONTENTS ledger is part of the document and
// lists its sections (h2 only, numbered) — it is what a phone reader gets,
// and it is a <details> so it never stands between them and §1. The ON THIS
// PAGE rail (>=1240px) is the fine-grained version with h3s and scrollspy.
// Neither has any business inside the document index.
let tocLinks = [], tocHeadings = [];
// The index's nested sections are a THIRD surface off the same headings, and
// deliberately its own pair of arrays rather than an index into tocLinks: the
// rail drops h3s on very long documents while this list is h2-only, so the two
// sets differ and any shared-index scheme is one refactor away from
// highlighting the wrong row.
let navSubLinks = [], navSubHeadings = [];
function headingText(h){ return h.textContent.replace(/#$/,'').trim(); }

function buildToc(slug){
  tocLinks = []; tocHeadings = [];
  navSubLinks = []; navSubHeadings = [];
  tocListEl.innerHTML = '';
  tocRail.hidden = true;
  navBody.querySelectorAll('.nav-sub,.nav-sub-more').forEach(n=>n.remove());
  content.querySelectorAll('.contents').forEach(n=>n.remove());

  const all = [...content.querySelectorAll('h1,h2,h3')];
  const entries = [];
  let seenFirstH1 = false;
  for (const h of all){
    // The first h1 is the document title, already the page name.
    if (h.tagName === 'H1' && !seenFirstH1){ seenFirstH1 = true; continue; }
    entries.push({ h, lv: h.tagName === 'H3' ? 3 : 2 });
  }
  if (!entries.length) return;

  const go = (h) => (ev) => {
    // Same page: scroll directly, so an identical hash still moves.
    ev.preventDefault();
    closeSheet();
    history.replaceState(null,'', '#' + slug + '~' + h.id);
    h.scrollIntoView({block:'start'});
  };

  // ── ON THIS PAGE rail. Very long documents drop their h3s rather than
  //    becoming a second scrolling wall.
  const deep = entries.filter(e=>e.lv===3).length;
  const railList = entries.length > 26 && deep ? entries.filter(e=>e.lv===2) : entries;
  railList.forEach(e=>{
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + slug + '~' + e.h.id;
    if (e.lv === 3) a.className = 'lv3';
    a.textContent = headingText(e.h);
    a.addEventListener('click', go(e.h));
    li.appendChild(a);
    tocListEl.appendChild(li);
    tocLinks.push(a); tocHeadings.push(e.h);
  });
  tocRail.hidden = false;

  // ── The active entry's own sections, nested into the document index.
  const sections = entries.filter(e=>e.lv===2);
  const activeItem = navBody.querySelector('a[aria-current="page"]');
  if (activeItem && sections.length >= 2){
    const host = activeItem.closest('li');
    if (host){
      const ul = document.createElement('ul');
      ul.className = 'nav-sub';
      ul.setAttribute('aria-label', 'Sections of ' + (bySlug[slug] ? bySlug[slug].title : 'this document'));
      sections.forEach((e,i)=>{
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + slug + '~' + e.h.id;
        a.innerHTML = '<span class="sx" aria-hidden="true"></span><span class="sn"></span>';
        a.firstElementChild.textContent = pad2(i+1);
        a.lastElementChild.textContent = headingText(e.h);
        a.addEventListener('click', go(e.h));
        li.appendChild(a);
        ul.appendChild(li);
        navSubLinks.push(a); navSubHeadings.push(e.h);
      });
      host.appendChild(ul);
      // Clip past twelve, with a control that says how many are hidden. A
      // silent clip would be a lie about the document's shape.
      if (sections.length > 12){
        ul.classList.add('clipped');
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'nav-sub-more';
        more.setAttribute('aria-expanded','false');
        more.textContent = '+ ' + (sections.length - 12) + ' more';
        more.addEventListener('click', ()=>{
          const clipped = ul.classList.toggle('clipped');
          more.setAttribute('aria-expanded', clipped ? 'false' : 'true');
          more.textContent = clipped ? ('+ ' + (sections.length - 12) + ' more') : 'Show fewer';
        });
        host.appendChild(more);
      }
    }
  }

  // ── CONTENTS ledger, injected into the document itself after the lede.
  if (sections.length >= 3){
    const det = document.createElement('details');
    det.className = 'contents';
    // Open by default where two columns of ledger cost only a few lines; a
    // phone gets a 46px summary instead of a nineteen-item preamble.
    try { det.open = window.matchMedia('(min-width:760px)').matches; } catch(e){ det.open = false; }
    const sum = document.createElement('summary');
    sum.innerHTML = '<span class="cs-n">§</span><span>Contents</span><span class="cs-r"></span>'+
      '<span>'+sections.length+' sections</span>'+
      '<svg class="cs-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    det.appendChild(sum);
    const ul = document.createElement('ul');
    ul.className = 'contents-list';
    sections.forEach((e,i)=>{
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + slug + '~' + e.h.id;
      a.innerHTML = '<span class="cl-n">'+pad2(i+1)+'</span><span></span>';
      a.lastElementChild.textContent = headingText(e.h);
      a.addEventListener('click', go(e.h));
      li.appendChild(a);
      ul.appendChild(li);
    });
    det.appendChild(ul);
    // After the title and its lede paragraph — the reader meets the document
    // before they meet its table of contents.
    const h1 = content.querySelector('h1');
    let after = h1;
    if (h1 && h1.nextElementSibling && h1.nextElementSibling.tagName === 'P') after = h1.nextElementSibling;
    if (after) after.after(det); else content.prepend(det);
  }
}

// How deep into THIS document the reader is, written onto the index entry for
// it as --rd. Deliberately measured off the page's own scroll range rather
// than off the article box: what a reader means by "how much is left" is how
// much further the page will move, which is exactly this. Clamped, and 100%
// at the very bottom so it never stalls at 98% on a short document.
function updateDepth(){
  const cur = navBody.querySelector('a[aria-current="page"] .pg');
  if (!cur) return;
  const span = document.documentElement.scrollHeight - window.innerHeight;
  const p = span <= 0 ? 1 : Math.min(1, Math.max(0, window.scrollY / span));
  cur.style.setProperty('--rd', (p * 100).toFixed(1) + '%');
}

// Scrollspy: mark the heading whose section the reader is actually in, and
// keep that marker inside the rail's own scroll region.
let spyTicking = false;

// activeHeading returns the index of the last heading in `list` whose top has
// crossed the reading line, or -1 while the reader is still in the preamble
// above the first one. At the very bottom of the page it pins to the last
// entry, so a short final section can still be reached by scrolling.
//
// Known trap, recorded because it has cost time before: this is a geometric
// test run on scroll, NOT an IntersectionObserver — a fast programmatic scroll
// does not fire IntersectionObserver, so a screenshot taken after an
// auto-scroll can show a stale or blank highlight that is a capture artifact
// rather than a bug. Reading the rect on every scroll frame has no such
// failure mode.
function activeHeading(list){
  const line = 110;
  let idx = -1;
  for (let i=0;i<list.length;i++){
    if (list[i].getBoundingClientRect().top <= line) idx = i; else break;
  }
  if (list.length && window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) idx = list.length - 1;
  return idx;
}

function updateSpy(){
  spyTicking = false;
  updateDepth();
  // The index's nested sections track the same reading position as the rail,
  // over their own (h2-only) list.
  if (navSubHeadings.length){
    const nIdx = activeHeading(navSubHeadings);
    navSubLinks.forEach((a,i)=>a.classList.toggle('here', i === nIdx));
  }
  if (!tocHeadings.length) return;
  const idx = activeHeading(tocHeadings);
  tocLinks.forEach((a,i)=>a.classList.toggle('here', i === idx));
  const cur = tocLinks[idx];
  if (cur && tocRail.offsetParent !== null && getComputedStyle(tocRail).overflowY === 'auto'){
    const nb = tocRail.getBoundingClientRect(), cb = cur.getBoundingClientRect();
    if (cb.top < nb.top + 8) tocRail.scrollTop -= (nb.top + 8 - cb.top);
    else if (cb.bottom > nb.bottom - 8) tocRail.scrollTop += (cb.bottom - nb.bottom + 8);
  }
}
window.addEventListener('scroll', ()=>{ if(!spyTicking){ spyTicking = true; requestAnimationFrame(updateSpy); } }, {passive:true});

// ---- Prev / next -----------------------------------------------------
function renderPrevNext(slug){
  const i = idxOf[slug];
  docFoot.innerHTML = '';
  if (i === undefined) { docFoot.hidden = true; return; }
  const prev = DOCS[i-1], next = DOCS[i+1];
  let html = '';
  if (prev) html += '<a class="prev" href="#'+prev.slug+'"><span class="dir">'+pad2(i)+' ← Previous</span><span class="t">'+esc(prev.title)+'</span></a>';
  if (next) html += '<a class="next" href="#'+next.slug+'"><span class="dir">Next → '+pad2(i+2)+'</span><span class="t">'+esc(next.title)+'</span></a>';
  docFoot.innerHTML = html;
  docFoot.hidden = !html;
}

// The pager already defines a linear path through the eighteen documents; the
// arrow keys just walk it without asking the reader to scroll to the bottom
// first. Held to the same guards as "/": never while typing, never when a
// modifier is down (⌘←/⌥← are browser and word-jump commands), and never
// while the mobile sheet is open, where the arrows belong to the list.
document.addEventListener('keydown', (e)=>{
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (rail.classList.contains('open')) return;
  // current() carries an optional "~heading" suffix; the pager works in
  // documents, so take the slug half only.
  const raw = current();
  const sep = raw.indexOf('~');
  const i = idxOf[sep === -1 ? raw : raw.slice(0, sep)];
  if (i === undefined) return;
  const to = DOCS[e.key === 'ArrowLeft' ? i - 1 : i + 1];
  if (!to) return;
  e.preventDefault();
  location.hash = '#' + to.slug;
});

// ---- The mobile index sheet ------------------------------------------
const rail = document.getElementById('docsNav');
const navToggle = document.getElementById('navToggle');
const navClose = document.getElementById('navClose');
const navScrim = document.getElementById('navScrim');
const railBody = document.getElementById('railBody');
const isSheet = () => window.matchMedia('(max-width:1023px)').matches;
let lastFocus = null;

function openSheet(){
  if (!isSheet() || rail.classList.contains('open')) return;
  lastFocus = document.activeElement;
  navScrim.hidden = false;
  // Force a frame so the scrim's opacity transition actually runs.
  requestAnimationFrame(()=>navScrim.classList.add('open'));
  rail.classList.add('open');
  navToggle.setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
  const cur = rail.querySelector('a[aria-current="page"]');
  if (cur) cur.scrollIntoView({block:'center'});
  navClose.focus();
}
function closeSheet(){
  if (!rail.classList.contains('open')) return;
  rail.classList.remove('open');
  navScrim.classList.remove('open');
  navToggle.setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
  setTimeout(()=>{ if(!rail.classList.contains('open')) navScrim.hidden = true; }, 260);
  if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({preventScroll:true}); } catch(e){} }
  lastFocus = null;
}
navToggle.addEventListener('click', ()=>{ rail.classList.contains('open') ? closeSheet() : openSheet(); });
navClose.addEventListener('click', closeSheet);
navScrim.addEventListener('click', closeSheet);
rail.addEventListener('click', (e)=>{ if (e.target.closest('a[data-slug]')) closeSheet(); });
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape' && rail.classList.contains('open')){ e.preventDefault(); closeSheet(); }
});
// Keep focus inside the sheet while it is the only thing on screen.
rail.addEventListener('keydown', (e)=>{
  if (e.key !== 'Tab' || !rail.classList.contains('open')) return;
  const f = [...rail.querySelectorAll('a[href],button,input,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length-1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
// Growing past the breakpoint with the sheet open would leave a fixed panel
// stuck over a desktop layout with the body scroll still locked.
window.addEventListener('resize', ()=>{ if (!isSheet()) closeSheet(); });

// ---- Search ----------------------------------------------------------
// Index is built once, lazily, from the same markdown the pages render —
// thirteen small files, all same-origin. Nothing is prebuilt or fetched
// from anywhere else.
const searchInput = document.getElementById('docSearch');
const searchResults = document.getElementById('searchResults');
const searchStatus = document.getElementById('searchStatus');
let searchIndex = null, indexing = null;

function indexDoc(doc, md){
  const out = [];
  const seen = {};
  let cur = { slug:doc.slug, page:doc.title, heading:doc.title, anchor:'', text:'' };
  let fence = false;
  md.split('\n').forEach(raw=>{
    const line = raw.replace(/^<!--.*-->\s*$/,'');
    if (/^\s*```/.test(line)) { fence = !fence; return; }
    const m = !fence && line.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);
    if (m){
      out.push(cur);
      const title = m[2].replace(/[`*_]/g,'');
      let id = slugify(title);
      if (seen[id]){ seen[id]++; id = id+'-'+seen[id]; } else { seen[id] = 0; }
      cur = { slug:doc.slug, page:doc.title, heading:title, anchor:out.length===1?'':id, text:'' };
      return;
    }
    const t = line.replace(/[`*_>|#-]+/g,' ').replace(/\s+/g,' ').trim();
    if (t) cur.text += (cur.text ? ' ' : '') + t;
  });
  out.push(cur);
  // The very first section is the document preamble; its anchor is the page.
  if (out.length) out[0].anchor = '';
  return out.filter(s => s.text || s.heading);
}
async function buildSearchIndex(){
  if (searchIndex) return searchIndex;
  if (indexing) return indexing;
  indexing = (async ()=>{
    const secs = [];
    await Promise.all(DOCS.map(async doc=>{
      try {
        const res = await fetch(doc.path, {cache:'force-cache'});
        if (!res.ok) return;
        indexDoc(doc, await res.text()).forEach(s=>secs.push(s));
      } catch(e){ /* a doc that will not load simply is not searchable */ }
    }));
    secs.forEach(s=>{ s.hay = (s.page+' '+s.heading+' '+s.text).toLowerCase(); s.hh = s.heading.toLowerCase(); });
    searchIndex = secs;
    return secs;
  })();
  return indexing;
}
function snippet(text, terms){
  const low = text.toLowerCase();
  let at = -1;
  for (const t of terms){ const i = low.indexOf(t); if (i !== -1 && (at === -1 || i < at)) at = i; }
  if (at === -1) at = 0;
  const start = Math.max(0, at - 60);
  let s = text.slice(start, start + 170);
  if (start > 0) s = '…' + s;
  if (start + 170 < text.length) s = s + '…';
  let html = esc(s);
  terms.forEach(t=>{
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    html = html.replace(re, '<mark>$1</mark>');
  });
  return html;
}
function runSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length || !searchIndex) return [];
  const hits = [];
  for (const s of searchIndex){
    if (!terms.every(t => s.hay.includes(t))) continue;
    let score = 0;
    for (const t of terms){
      if (s.hh.includes(t)) score += 10;
      if (s.page.toLowerCase().includes(t)) score += 4;
      let i = 0, n = 0;
      while ((i = s.hay.indexOf(t, i)) !== -1 && n < 12){ n++; i += t.length; }
      score += n;
    }
    hits.push({ s, score });
  }
  hits.sort((a,b)=>b.score-a.score);
  return hits.slice(0,10).map(h=>h.s);
}
function renderSearch(q){
  const query = q.trim();
  if (!query){
    searchResults.hidden = true;
    searchResults.innerHTML = '';
    navBody.hidden = false;
    searchStatus.textContent = '';
    return;
  }
  navBody.hidden = true;
  searchResults.hidden = false;
  if (!searchIndex){ searchResults.innerHTML = '<div class="sr-empty">Indexing…</div>'; return; }
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = runSearch(query);
  if (!hits.length){
    searchResults.innerHTML = '<div class="sr-empty">No matches for “'+esc(query)+'”.</div>';
    searchStatus.textContent = 'No results';
    return;
  }
  searchResults.innerHTML = hits.map(s=>
    '<a class="sr-item" href="#'+s.slug+(s.anchor?'~'+s.anchor:'')+'">'+
      '<span class="sr-page">'+esc(s.page)+'</span>'+
      '<span class="sr-head">'+snippet(s.heading, terms)+'</span>'+
      (s.text ? '<span class="sr-snip">'+snippet(s.text, terms)+'</span>' : '')+
    '</a>').join('');
  searchStatus.textContent = hits.length + ' result' + (hits.length===1?'':'s');
}
let searchTimer = 0;
async function onSearchInput(){
  const q = searchInput.value;
  renderSearch(q);
  if (q.trim() && !searchIndex){ await buildSearchIndex(); renderSearch(searchInput.value); }
}
searchInput.addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(onSearchInput, 80); });
searchInput.addEventListener('focus', ()=>{ buildSearchIndex(); });
searchInput.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape'){ e.stopPropagation(); searchInput.value = ''; renderSearch(''); searchInput.blur(); }
  else if (e.key === 'ArrowDown'){
    const first = searchResults.querySelector('.sr-item');
    if (first){ e.preventDefault(); first.focus(); }
  } else if (e.key === 'Enter'){
    const first = searchResults.querySelector('.sr-item');
    if (first){ e.preventDefault(); first.click(); }
  }
});
searchResults.addEventListener('keydown', (e)=>{
  const items = [...searchResults.querySelectorAll('.sr-item')];
  const i = items.indexOf(document.activeElement);
  if (i === -1) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); (items[i+1]||items[0]).focus(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); if (i === 0) searchInput.focus(); else items[i-1].focus(); }
  else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); searchInput.focus(); }
});
searchResults.addEventListener('click', (e)=>{
  if (!e.target.closest('.sr-item')) return;
  searchInput.value = ''; renderSearch(''); closeSheet();
});
document.addEventListener('keydown', (e)=>{
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  if (isSheet()) openSheet();
  searchInput.focus();
  searchInput.select();
});

// ---- Page load -------------------------------------------------------
async function load(raw){
  // The hash is "<page-slug>" or "<page-slug>~<heading-anchor>" — '~' is the
  // separator (see the cross-doc link rewrite below) so a page slug and an
  // in-page heading anchor can share one URL fragment unambiguously.
  const sep = raw.indexOf('~');
  const slug = sep === -1 ? raw : raw.slice(0, sep);
  const subAnchor = sep === -1 ? '' : raw.slice(sep + 1);
  const doc = bySlug[slug] || DOCS[0];
  const i = idxOf[doc.slug];
  setActive(doc.slug);
  docRail.innerHTML =
    '<a href="#'+DOCS[0].slug+'">Docs</a>'+
    '<span class="dr-grp">'+esc(GROUPS[doc.group].n+' · '+GROUPS[doc.group].label)+'</span>'+
    '<span class="dr-ix">Document '+pad2(i+1)+' / '+pad2(DOCS.length)+'</span>';
  content.innerHTML = '<p class="doc-loading">Loading…</p>';
  try {
    const res = await fetch(doc.path, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    assignHeadingIds();
    content.querySelectorAll('img').forEach(img=>{
      const s=img.getAttribute('src')||'';
      if(/^https?:/i.test(s)) return;
      const m=s.match(/(?:\.\.\/)*(?:docs\/)?screenshots\/(.+)$/);
      if(m) img.setAttribute('src','./screenshots/'+m[1]);
    });
    // Cross-doc links (e.g. ADMIN-GUIDE.md#cost-accounting, ../ROADMAP.md)
    // become index navigation; a heading fragment on the target survives as
    // "#slug~anchor" so load() can scroll to it once the target page renders.
    content.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m=h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if(target) a.setAttribute('href','#'+target.slug+(m[2]?'~'+m[2].slice(1):''));
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    highlightCode();
    await renderMermaid();
    buildLangPickers();
    decorateCode();
    markColumnarScroll();
    wrapTables();
    addHeadingAnchors(doc.slug);
    buildToc(doc.slug);
    renderPrevNext(doc.slug);
    const anchorEl = subAnchor && document.getElementById(subAnchor);
    // html{scroll-behavior:smooth} would otherwise animate this jump — often a
    // multi-thousand-pixel leap on a freshly-loaded page — over a
    // multi-second crawl. Land instantly, exactly like a same-page fragment
    // navigation would.
    //
    // `behavior:'instant'` on the call itself, not just the inline-style guard
    // around it: scrollIntoView QUEUES its scroll, and restoring the property
    // in the same task handed the queued scroll back to the CSS `smooth` value
    // before it ever ran. Following an in-document link therefore still crawled
    // ~5,600px over about a second. The explicit behavior cannot be raced; the
    // style guard stays for engines that ignore it, and is now released a frame
    // later so it cannot lose the same way.
    const prevBehavior = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = 'auto';
    if(anchorEl) anchorEl.scrollIntoView({block:'start', behavior:'instant'});
    else window.scrollTo({top:0, behavior:'instant'});
    requestAnimationFrame(()=>{ document.documentElement.style.scrollBehavior = prevBehavior; });
    // Webfonts land after this scroll and reflow everything above the target,
    // which left a deep link sitting ~80px off its own heading in a long
    // document. Re-aim once the fonts are in — but only if the reader has not
    // scrolled in the meantime, because correcting a position they chose
    // themselves would be worse than the error being corrected.
    if(anchorEl && document.fonts && document.fonts.ready){
      const landedAt = window.scrollY;
      document.fonts.ready.then(()=>{
        if(Math.abs(window.scrollY - landedAt) > 4) return;
        anchorEl.scrollIntoView({block:'start', behavior:'instant'});
      }).catch(()=>{});
    }
    updateSpy();
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+esc(doc.path.split('/').pop())+'</code> — '+esc(err.message)+'</div>';
    docFoot.hidden = true;
    tocRail.hidden = true;
  }
}

function current(){ return (location.hash||'').replace('#','') || DOCS[0].slug; }
window.addEventListener('hashchange', ()=>{ closeSheet(); load(current()); });
load(current());

// Theme toggle — same 'llmux-site-theme' localStorage key as index.html, so a
// choice made on either page is honoured on the other (see the head script).
(function(){
  var THEME_KEY='llmux-site-theme';
  var btn=document.getElementById('themeBtn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });
})();
</script>
