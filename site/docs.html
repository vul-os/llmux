<!-- Theme resolved before first paint — same localStorage key + same logic as
     index.html, so an explicit choice made on either page survives navigating
     to the other instead of silently reverting to the OS preference. -->

}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();

/* ═══════════════════════════════════════════════════════════════════════════
   llmux — DOCUMENTATION.  Design thesis: THE PATCH BAY, WIRED FOR READING.

   The landing next door is the front panel of a multiplexer: numbered
   channels, a continuous signal bus down the left, hairline rules, zero
   rounded corners, mono for every label, and exactly one accent — the brand
   teal — meaning "this signal was permitted". The docs used to be a generic
   grey card-and-pill sidebar next to a column of prose, so the two halves of
   the site read as two different products.

   So this page is the SAME instrument, patched for reading:

     · The document index is a rack directory, not a list of thirteen equal
       links. Five numbered groups follow the reader's actual journey —
       START, SYSTEM, REFERENCE, OPERATE, PROJECT — and every document carries
       its ordinal (01…13) so "where am I in the body of documentation" is a
       figure, not a highlight.
     · The landing's signal bus runs down the index, and the document you are
       reading is the channel that is patched through: a teal tap node on the
       bus, a spur into the row, a teal edge on the row itself.
     · "Which document" and "where inside it" are two different questions and
       never share one list. The index answers the first; a ruled CONTENTS
       ledger inside the document, and a hairline ON THIS PAGE rail at
       ≥1240px, answer the second.
     · Long documents are ruled like a ledger: every h2 crosses the column on
       a hairline with a teal tick, every code fence wears a titled bar with
       its language and a permanently visible COPY, tables are mono-headed
       hairline grids, notes are teal-edged panels. Nothing is a rounded card.

   Type: ARCHIVO (variable width) for display, INSTRUMENT SANS for text, IBM
   PLEX MONO for every label, ordinal and route — the same width-contrast axis
   the landing uses.

   Everything is vendored: no CDN, no external font, no remote image, no
   analytics. Same sovereignty rule the product keeps.
   ═══════════════════════════════════════════════════════════════════════════ */

@font-face{font-family:'Archivo Variable';font-style:normal;font-display:swap;
  font-weight:100 900;font-stretch:62% 125%;
  src:url(./assets/fonts/archivo-latin-standard.woff2) format('woff2-variations')}
@font-face{font-family:'Instrument Sans Variable';font-style:normal;font-display:swap;
  font-weight:400 700;font-stretch:75% 100%;
  src:url(./assets/fonts/instrument-sans-latin-standard.woff2) format('woff2-variations')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:400;
  src:url(./assets/fonts/ibm-plex-mono-latin-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:500;
  src:url(./assets/fonts/ibm-plex-mono-latin-500.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:600;
  src:url(./assets/fonts/ibm-plex-mono-latin-600.woff2) format('woff2')}

*,*::before,*::after{box-sizing:border-box}
*{min-width:0}

:root{
  --display:'Archivo Variable',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Instrument Sans Variable',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;

  --max:1300px;
  --pad:28px;
  --header-h:60px;
  --tab-h:54px;                /* the mobile document-index tab */
  /* The document index rail. On desktop it is a FIXED chassis rail bolted to
     the far left edge of the viewport — not a grid cell inside the centred
     wrapper — so --rail-w is the offset every other desktop block clears. */
  --rail-w:272px;
  --ease:cubic-bezier(.16,1,.3,1);

  /* Reading measure. Deliberately px, not ch: `ch` is the width of "0", and
     Instrument Sans draws a wide figure (1ch ≈ .666em), so 70ch measures well
     over 800px — i.e. no cap at all. 660px is ~78 characters at the 16.5px
     body size. Code fences, tables, diagrams and images deliberately are NOT
     capped: a wide snippet gets the whole column while the paragraphs stay
     readable. */
  --measure:660px;

  /* ── Syntax highlighting ─────────────────────────────────────────────────
     The shared Vulos code palette, byte-identical to index.html's, and
     deliberately NOT themed. The code surface is a fixed dark carbon panel in
     BOTH page themes — the same decision the landing and the sibling projects
     make — so every token colour is chosen once against --hl-bg and never
     needs a light/dark pair. Because the surface is constant, so is the
     measured contrast:

       fg  #C8D4E3 12.63:1   keyword #C4B5FD 10.27:1   string  #5EEAD4 12.82:1
       num #FBBF24 11.36:1   fn      #7DD3FC 11.37:1   prop    #93C5FD 10.52:1
       var #FDA4AF 10.03:1   meta    #FDBA74 11.24:1   punct   #8195AC  6.17:1
       del #FCA5A5  9.99:1   add     #86EFAC 13.51:1   comment #6C7D94  4.51:1

     Comment is #6C7D94 rather than the palette's nominal #6B7C93: that value
     measures 4.45:1, a hair under AA. One LSB per channel is invisible and
     clears 4.5:1. --hl-bar carries the fence's title strip; on it --hl-punct
     measures 5.81:1 and --hl-fg 11.90:1. */
  --hl-bg:#0C1116; --hl-bar:#111820; --hl-line:#22303C; --hl-line-2:#2C3D4C;
  --hl-fg:#C8D4E3; --hl-comment:#6C7D94; --hl-keyword:#C4B5FD; --hl-string:#5EEAD4;
  --hl-number:#FBBF24; --hl-function:#7DD3FC; --hl-property:#93C5FD;
  --hl-variable:#FDA4AF; --hl-meta:#FDBA74; --hl-punct:#8195AC;
  --hl-deletion:#FCA5A5; --hl-addition:#86EFAC;
}

/* ── DARK: the rack in a dim room. This is the DEFAULT set, written onto
      :root rather than onto [data-theme="dark"], because the theme attribute
      is only ever written by script — with JavaScript off no attribute is set
      at all, and a page whose entire palette hangs off that selector renders
      with no palette whatsoever. The attribute selectors below still win when
      the script does run, so the toggle keeps working.
      Contrast on --canvas #0A0F12 (dark):
        ink   #E9EFED 16.31:1   body  #D3DCDA 12.99:1   muted #9AA9A8  7.15:1
        faint #8A9B9A  5.90:1   teal  #3EDBC7 11.02:1   rust  #EE8768  8.14:1
      and on --panel #101A1E:
        ink 15.06:1  body 11.99:1  muted 6.60:1  faint 5.44:1  teal 10.17:1 */
:root{
  color-scheme:dark;
  --canvas:#0A0F12;
  --panel:#101A1E;
  --sunk:#070C0E;
  --tint:rgba(255,255,255,.028);
  --ink:#E9EFED;
  --body:#D3DCDA;
  --muted:#9AA9A8;
  --faint:#8A9B9A;
  --line:#1C2A2E;
  --line-2:#25373C;
  --line-3:#33494F;
  --teal:#2DD4BF;
  --teal-ink:#3EDBC7;
  --teal-wash:#0C2B29;
  --teal-edge:#1E5B55;
  --rust:#EE8768;
  --rust-wash:#2B140E;
  --rust-edge:#5C2C1D;
  --sheet-shadow:0 -22px 48px -20px rgba(0,0,0,.85);
}

/* ── LIGHT: the same rack under drafting-room light.
      Contrast on --canvas #EBEFED (light):
        ink   #0B1416 16.61:1   body  #2A3739 10.06:1   muted #485658  6.62:1
        faint #505E60  5.87:1   teal  #08655B  6.31:1   rust  #9C3E27  6.35:1
      and on --panel #F8FAF9:
        ink 17.96:1  body 10.88:1  muted 7.16:1  faint 6.35:1  teal 6.82:1 */
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --canvas:#EBEFED;
    --panel:#F8FAF9;
    --sunk:#DDE4E1;
    --tint:rgba(11,20,22,.032);
    --ink:#0B1416;
    --body:#2A3739;
    --muted:#485658;
    --faint:#505E60;
    --line:#D2DAD8;
    --line-2:#BFC9C7;
    --line-3:#A6B3B1;
    --teal:#0A6E63;
    --teal-ink:#08655B;
    --teal-wash:#DCE9E6;
    --teal-edge:#8FBAB3;
    --rust:#9C3E27;
    --rust-wash:#F3E2DC;
    --rust-edge:#D2A695;
    --sheet-shadow:0 -18px 40px -22px rgba(11,20,22,.4);
  }
}

/* The script's explicit choice outranks the system preference, both ways. */
[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0A0F12; --panel:#101A1E; --sunk:#070C0E; --tint:rgba(255,255,255,.028);
  --ink:#E9EFED; --body:#D3DCDA; --muted:#9AA9A8; --faint:#8A9B9A;
  --line:#1C2A2E; --line-2:#25373C; --line-3:#33494F;
  --teal:#2DD4BF; --teal-ink:#3EDBC7; --teal-wash:#0C2B29; --teal-edge:#1E5B55;
  --rust:#EE8768; --rust-wash:#2B140E; --rust-edge:#5C2C1D;
  --sheet-shadow:0 -22px 48px -20px rgba(0,0,0,.85);
}
[data-theme="light"]{
  color-scheme:light;
  --canvas:#EBEFED; --panel:#F8FAF9; --sunk:#DDE4E1; --tint:rgba(11,20,22,.032);
  --ink:#0B1416; --body:#2A3739; --muted:#485658; --faint:#505E60;
  --line:#D2DAD8; --line-2:#BFC9C7; --line-3:#A6B3B1;
  --teal:#0A6E63; --teal-ink:#08655B; --teal-wash:#DCE9E6; --teal-edge:#8FBAB3;
  --rust:#9C3E27; --rust-wash:#F3E2DC; --rust-edge:#D2A695;
  --sheet-shadow:0 -18px 40px -22px rgba(11,20,22,.4);
}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-size:16.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--teal);color:var(--canvas)}
:where(a,button,input,summary,[tabindex]):focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--teal);color:#04100E;
  font-family:var(--mono);font-size:13px;padding:12px 18px}
[data-theme="light"] .skip{color:#FFFFFF}
.skip:focus{left:12px;top:12px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* ═══ Header — the landing's, verbatim in feel: hairline, mono, square ════ */
.site-header{position:sticky;top:0;z-index:80;background:var(--canvas);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;flex:none;height:44px}
.brand img{width:26px;height:26px;border-radius:7px}
/* The wordmark has to read as ONE word, "llmux".
   It must NOT be set in the mono face. IBM Plex Mono draws lowercase `l` as a
   bare vertical stem with a top serif and a foot — glyph-identical to its `1` —
   and a monospace advance pads every glyph, so `ll` separates from `mux` and
   the pair reads as the digits "11". Set in mono at 600 the header literally
   spelled "11mux".
   The fix, the same one index.html and web/ui.html carry: the SANS/display
   skeleton (no serifed stem, and `1` keeps a diagonal flag so it can never be
   confused for `l`), weight 700, tight NEGATIVE tracking to close the pair up,
   `ll` in the text colour and `mux` in the accent, and no whitespace
   whatsoever between the two spans in the markup. */
.brand .word{
  font-family:var(--display);font-weight:700;font-variation-settings:'wdth' 100;
  font-size:19.5px;line-height:1;letter-spacing:-.045em;color:var(--ink);
}
.brand .word .mux{color:var(--teal-ink)}
.nav-spacer{flex:1}
.secnav{display:flex;gap:2px}
.secnav a{
  font-family:var(--mono);font-size:12.2px;letter-spacing:.04em;color:var(--muted);
  padding:0 11px;height:44px;display:inline-flex;align-items:center;
  border-bottom:2px solid transparent;transition:color .18s,border-color .18s;
}
.secnav a:hover{color:var(--ink);border-bottom-color:var(--teal)}
.secnav a.here{color:var(--ink);border-bottom-color:var(--teal)}
.hdr-act{display:flex;align-items:center;gap:6px;flex:none}
.hbtn{
  height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:0 12px;border:1px solid var(--line-2);background:transparent;color:var(--muted);
  font-family:var(--mono);font-size:12.2px;cursor:pointer;transition:color .18s,border-color .18s;
}
.hbtn:hover{color:var(--ink);border-color:var(--line-3)}
.hbtn svg{width:15px;height:15px;flex:none}
.hbtn.sq{padding:0;width:44px}
.hbtn img{width:17px;height:17px;border-radius:4px}
#themeBtn .sun{display:none}
[data-theme="light"] #themeBtn .sun{display:block}
[data-theme="light"] #themeBtn .moon{display:none}
@media (max-width:860px){.secnav{display:none}}
/* From 1024 the index rail is bolted to the left edge of the VIEWPORT, so the
   chrome above it lines up with the rail instead of with a centred wrapper,
   and the rail's surface and its right hairline carry on up through the
   header: one chassis, not a bar floating across a rail. Every other property
   — hairline, mono tabs, square buttons, the brand, the Vulos button — is the
   landing's, unchanged. */
@media (min-width:1024px){
  .site-header{background:linear-gradient(90deg,var(--panel) 0 var(--rail-w),var(--canvas) var(--rail-w) 100%)}
  .site-header>.wrap{max-width:none;margin:0;padding-inline:20px var(--pad)}
  .site-header::after{content:"";position:absolute;left:calc(var(--rail-w) - 1px);top:0;bottom:0;
    width:1px;background:var(--line-2)}
}

/* ═══ Shell ══════════════════════════════════════════════════════════════
   Below 1024 this is one plain column and the index is a bottom sheet, so the
   reader meets prose immediately.

   From 1024 the index leaves the flow entirely: `.rail` becomes
   `position:fixed` against the LEFT EDGE OF THE VIEWPORT (see the rail block
   further down), so it is genuinely pinned rather than a sticky cell sitting
   98px in behind a centred 1300px wrapper. What is left here is therefore no
   longer a three-column grid — it is the document, plus an ON THIS PAGE rail
   from 1300 — laid out in the space to the RIGHT of the fixed rail. That space
   is claimed with padding-inline, not with `margin:0 auto`, because the shell
   must start where the rail ends at every width above the breakpoint. */
/* padding-BLOCK, never the `padding` shorthand. This element is `wrap
   docs-shell`, and .wrap supplies the horizontal gutter — a shorthand here
   resets that to 0 and every heading, paragraph and table sits flush against
   both screen edges below 1024px, where no grid column is left to fake an
   inset. That has now shipped twice; the shorthand is the whole bug.
   `padding-inline` below is the deliberate, axis-explicit replacement for that
   gutter on desktop; it is never the shorthand. */
.docs-shell{padding-block:0 40px}
.docs-main{min-width:0}
@media (min-width:1024px){
  .docs-shell{
    max-width:none;margin:0;
    padding-inline:calc(var(--rail-w) + 46px) var(--pad);
    padding-block:34px 90px;
    display:grid;grid-template-columns:minmax(0,880px);gap:52px;align-items:start;
  }
  /* The footer runs under the same rail, so it clears it by the same amount
     and stays aligned with the document column rather than hiding behind the
     chassis. */
  .site-footer>.wrap{max-width:none;margin:0;
    padding-inline:calc(var(--rail-w) + 46px) var(--pad)}
}
/* The third column earns its keep from 1300 up: at 1440 the document still
   gets 812px — wider than the 660px measure, so nothing is taken from the
   prose — and these documents are long enough (the API reference alone runs
   past forty headings) that "where am I inside this page" is a real second
   question. Below 1300 it would start eating the measure, so it folds away and
   the document takes the whole span. */
@media (min-width:1300px){
  .docs-shell{grid-template-columns:minmax(0,860px) 236px}
}

/* ═══ The document index ═════════════════════════════════════════════════
   A rack directory: six numbered groups, one ordinal per document, and the
   landing's signal bus running down the left — the document you are reading
   is the channel patched through, marked by a tap node on the bus, a spur
   into the row, and a teal edge.

   It used to be a flat list on principle: "which document" is one question,
   and it always got the whole list. That held at thirteen documents. At
   eighteen it does not — the set now has a four-document EMBED chapter that a
   reader looking for provider parity has no use for, and the index outran the
   viewport on a laptop. So two things changed, both narrowly:

   - Groups COLLAPSE, and remember it (localStorage, per group). The group you
     are reading is always forced open, because an index that hides the page
     you are on is worse than a long one.
   - The ACTIVE document — and only that one — expands to its own h2 sections.
     This is the same argument the depth bar below already makes: "where am I
     inside this document" is answered where the eye already is. The ON THIS
     PAGE rail exists only from 1300px up, so between 1024 and 1299, and in the
     phone sheet, this is the only in-document structure there is. */
.rail-eyebrow{
  display:flex;align-items:center;gap:10px;margin:0 0 14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
}
.rail-eyebrow .re-r{flex:1;height:1px;background:var(--line)}
.rail-head{display:none}

.rail-nav{position:relative;padding-left:26px}
.rail-nav::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.nav-grp{margin:0 0 6px}
.nav-grp+.nav-grp{margin-top:16px}
/* The group header is a real <button>: it toggles its group, so it has to be
   focusable, activatable by keyboard, and it has to say aria-expanded. The
   reset is deliberate and complete — a UA button brings its own font, its own
   background and a border, all three of which would break the rack. */
.nav-grp-h{
  display:flex;align-items:center;gap:9px;width:100%;margin:0 0 4px;padding:8px 9px 8px 0;
  min-height:36px;background:none;border:0;text-align:left;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:inherit;
}
.nav-grp-h .gn{color:var(--teal-ink);font-weight:600;flex:none;transition:color .16s}
.nav-grp-h .gl{color:var(--ink);font-weight:500;flex:none}
.nav-grp-h .gr{flex:1;height:1px;background:var(--line);min-width:10px}
.nav-grp-h .gt{flex:none;width:12px;height:12px;color:var(--faint);transition:transform .18s var(--ease),color .16s}
.nav-grp-h:hover .gt,.nav-grp-h:focus-visible .gt{color:var(--teal-ink)}
.nav-grp-h[aria-expanded="false"] .gt{transform:rotate(-90deg)}
/* The count only appears once the group is shut — open, the entries are their
   own count; shut, "4" is the whole information the header can still carry. */
.nav-grp-h .gc{flex:none;font-size:11px;letter-spacing:.06em;color:var(--faint);display:none}
.nav-grp-h[aria-expanded="false"] .gc{display:inline}
.nav-list{list-style:none;margin:0;padding:0}
.nav-grp.shut .nav-list{display:none}
.nav-item{
  position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:7px;align-items:center;
  min-height:44px;padding:9px;border-left:1px solid transparent;color:var(--muted);
  font-size:14.2px;line-height:1.35;transition:color .16s,background .16s,border-color .16s;
}
.nav-item .ix{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--faint);transition:color .16s}
.nav-item:hover{color:var(--ink);background:var(--panel);border-left-color:var(--line-3)}
.nav-item:hover .ix{color:var(--teal-ink)}
.nav-item[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--sunk);border-left-color:var(--teal-edge)}
.nav-item[aria-current="page"] .ix{color:var(--teal-ink);font-weight:600}
/* How far into this document the reader is, drawn on the document's own edge.
   The dim teal rule is the whole document; the bright bar filling down it is
   how much of it is behind you. It is the same answer the ON THIS PAGE rail
   gives with `.here`, kept where the eye already is — on the entry that says
   which document you are in — and it survives at 1024, where that rail is
   folded away and nothing else reports depth. */
.nav-item .pg{position:absolute;left:-1px;top:0;width:2px;height:0;background:transparent}
/* max() so the bar never vanishes at the top of a document: at 0% read it is
   still a visible teal cap saying "this one, and you are at its start". */
.nav-item[aria-current="page"] .pg{height:max(12px,var(--rd,0%));background:var(--teal);transition:height .1s linear}
/* The tap: this channel joins the bus. */
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:-29.5px;top:50%;margin-top:-4px;width:7px;height:7px;
  background:var(--canvas);border:1px solid var(--teal);
}
/* The spur: the run from the bus into this row. */
.nav-item[aria-current="page"]::after{
  content:"";position:absolute;left:-22px;top:50%;width:22px;height:1px;background:var(--teal-edge);
}

/* ── The active document's own sections, nested one level under it. h2 only:
      h3s would turn the index into the second scrolling wall the ON THIS PAGE
      rail was separated out to avoid. The 24px inset lines these up with the
      `.nm` column of the entry above, not with its ordinal. */
.nav-sub{list-style:none;margin:0 0 8px;padding:0 0 0 24px;border-left:1px solid var(--line)}
.nav-sub a{
  display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 9px 5px 11px;
  margin-left:-1px;border-left:1px solid transparent;
  color:var(--muted);font-size:12.9px;line-height:1.35;
  transition:color .16s,border-color .16s,background .16s;
}
.nav-sub a .sx{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;transition:color .16s}
.nav-sub a:hover{color:var(--ink);border-left-color:var(--line-3);background:var(--panel)}
.nav-sub a.here{color:var(--ink);border-left-color:var(--teal);font-weight:600}
.nav-sub a.here .sx{color:var(--teal-ink)}
/* A long document would otherwise push the rest of the index off the bottom of
   the rail. Past twelve sections the tail is clipped and a "show all" control
   opens it — the clip is never silent. */
.nav-sub.clipped li:nth-child(n+13){display:none}
.nav-sub-more{
  display:block;width:100%;margin:2px 0 0;padding:7px 9px 7px 11px;min-height:34px;
  background:none;border:0;border-left:1px solid transparent;text-align:left;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
}
.nav-sub-more:hover{color:var(--teal-ink)}
@media (max-width:1023px){
  .nav-sub a{min-height:44px;font-size:14.5px}
  .nav-sub-more{min-height:44px}
}
/* …and it stands down the moment the ON THIS PAGE rail appears. Rendered at
   1440 they were two identical twelve-item lists 900px apart, and the nested
   copy pushed the REST of the index — the thing the left rail is for — a
   screen and a half down. The rail is also strictly the better surface where
   it exists: it carries h3s, this does not. Same breakpoint and same reasoning
   as the in-document CONTENTS ledger below, which stands down here too. */
@media (min-width:1240px){
  .nav-sub,.nav-sub-more{display:none}
}

/* ── Index search — the index is built lazily from the same markdown the
      pages render, so it stays self-contained (no service, no prebuilt
      blob, no off-origin request). */
.rail-search{position:relative;margin:0 0 16px}
.rail-search .rs-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint);pointer-events:none}
.rail-search input{
  width:100%;height:44px;border:1px solid var(--line-2);background:var(--sunk);color:var(--ink);
  font-family:var(--mono);font-size:12.5px;padding:0 34px 0 33px;-webkit-appearance:none;appearance:none;border-radius:0;
}
.rail-search input::placeholder{color:var(--faint);letter-spacing:.04em}
.rail-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.rail-search input:focus{border-color:var(--teal);outline:none}
.rail-search kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;
  color:var(--faint);border:1px solid var(--line-2);padding:1px 5px;pointer-events:none;
}
.rail-search input:focus~kbd,.rail-search input:not(:placeholder-shown)~kbd{display:none}
.search-results{margin:0 0 6px}
.sr-item{display:block;padding:9px 10px;border-left:1px solid var(--line);transition:background .16s,border-color .16s}
.sr-item:hover,.sr-item:focus-visible{background:var(--panel);border-left-color:var(--teal)}
.sr-page{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sr-head{display:block;color:var(--ink);font-weight:600;font-size:13.8px;line-height:1.3;margin:3px 0 2px}
.sr-snip{display:block;color:var(--muted);font-size:12.4px;line-height:1.45;max-height:2.95em;overflow:hidden}
.sr-item mark{background:var(--teal-wash);color:var(--teal-ink);padding:0 1px}
.sr-empty{padding:10px;color:var(--muted);font-size:13.5px}

/* ── Index: the desktop chassis rail ──────────────────────────────────────
   FIXED to the far left edge of the viewport, floor to ceiling under the
   header, and it does not move when the document scrolls. Not sticky: sticky
   still belongs to the flow, so it inherits the centred wrapper's inset and
   drifts by whatever the difference between its flow position and its stuck
   position happens to be. Fixed has no flow position to drift from.

   It reads as a rail and not as a floating card: its own panel surface, one
   hairline down its right edge, square corners, mono labels. */
@media (min-width:1024px){
  .rail{
    position:fixed;left:0;top:var(--header-h);bottom:0;z-index:70;
    width:var(--rail-w);display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line-2);
  }
  .rail-body{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:0 20px 28px;
    scrollbar-width:thin;scrollbar-color:var(--line-3) transparent;
  }
  .rail-body::-webkit-scrollbar{width:8px}
  .rail-body::-webkit-scrollbar-track{background:transparent}
  .rail-body::-webkit-scrollbar-thumb{background:var(--line-3)}
  /* Search stays reachable at any scroll depth inside a 13-entry index. */
  .rail-search{position:sticky;top:0;z-index:2;background:var(--panel);
    margin:0 0 14px;padding:16px 0 12px}
  .rail-eyebrow{margin:16px 0 10px}
}

/* ── Index: phone & tablet ────────────────────────────────────────────────
   NOT a disclosure bar pinned under the header. A reader on a phone wants the
   document first; the index is a place they go, not a thing that sits on top
   of every page permanently eating vertical space at the least reachable end
   of the screen. So the index lives in a bottom sheet, summoned by a fixed
   thumb-height tab at the bottom edge — one-handed, always available at any
   scroll depth, and it shows where you are (name + ordinal) without costing
   the document a single pixel of the top of the viewport. */
@media (max-width:1023px){
  .rail{
    position:fixed;left:0;right:0;bottom:0;z-index:95;
    display:flex;flex-direction:column;max-height:min(82vh,660px);
    background:var(--panel);border-top:1px solid var(--line-3);box-shadow:var(--sheet-shadow);
    transform:translateY(101%);visibility:hidden;
    transition:transform .28s var(--ease),visibility .28s;
    padding:0 20px 20px;
  }
  .rail.open{transform:none;visibility:visible}
  .rail-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:2;background:var(--panel);
    margin:0 -20px 14px;padding:0 20px;border-bottom:1px solid var(--line);
  }
  .rail-head .rh-t{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
  .rail-head .rh-x{
    height:48px;min-width:48px;display:inline-flex;align-items:center;gap:8px;padding:0 6px;
    background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11.5px;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  }
  .rail-head .rh-x svg{width:16px;height:16px}
  .rail-eyebrow{display:none}
  .rail-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
  .rail-search{margin:0 0 14px}
  .rail-search input{height:48px;font-size:15px}
  .nav-item{min-height:48px;align-items:center;padding:10px 10px;font-size:15.5px}
  .nav-grp+.nav-grp{margin-top:20px}
  .sr-item{padding:12px 10px}
  .docs-main{padding-top:22px}
}

/* The tab: fixed to the bottom edge, thumb-reachable, and a status line in
   its own right — it always names the document you are in and its ordinal. */
.index-tab{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  display:flex;align-items:center;gap:13px;width:100%;min-height:var(--tab-h);
  padding:0 var(--pad) env(safe-area-inset-bottom);
  background:var(--canvas);border:0;border-top:1px solid var(--line-3);
  color:var(--ink);font:inherit;text-align:left;cursor:pointer;
}
.index-tab .it-icon{width:17px;height:17px;color:var(--teal-ink);flex:none}
.index-tab .it-txt{flex:1;min-width:0}
.index-tab .it-lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.index-tab .it-cur{display:block;font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.index-tab .it-ix{flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--teal-ink)}
@media (min-width:1024px){.index-tab{display:none}}
@media (max-width:1023px){body{padding-bottom:var(--tab-h)}}

.scrim{position:fixed;inset:0;z-index:93;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.open{opacity:1;pointer-events:auto}
@media (min-width:1024px){.scrim{display:none}}

/* ═══ ON THIS PAGE — the second question, answered in its own place ═══════ */
.toc{display:none}
@media (min-width:1240px){
  .toc{
    display:block;position:sticky;top:calc(var(--header-h) + 24px);
    max-height:calc(100vh - var(--header-h) - 48px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--line-3) transparent;
  }
  .toc::-webkit-scrollbar{width:8px}
  .toc::-webkit-scrollbar-thumb{background:var(--line-3)}
}
.toc-h{
  display:flex;align-items:center;gap:9px;margin:0 0 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.toc-h .th-r{flex:1;height:1px;background:var(--line)}
.toc-list{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc-list a{
  display:flex;align-items:center;min-height:44px;padding:6px 0 6px 13px;margin-left:-1px;
  border-left:1px solid transparent;
  color:var(--muted);font-size:12.7px;line-height:1.4;transition:color .16s,border-color .16s;
}
.toc-list a:hover{color:var(--ink);border-left-color:var(--line-3)}
.toc-list a.lv3{padding-left:24px;font-size:12.2px}
.toc-list a.here{color:var(--teal-ink);border-left-color:var(--teal);font-weight:600}

/* ═══ Document head — the landing's toprail, one document wide ════════════ */
.doc-rail{
  display:flex;flex-wrap:wrap;align-items:center;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
}
.doc-rail span,.doc-rail a{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;
  border-right:1px solid var(--line)}
.doc-rail :first-child{padding-left:0}
.doc-rail a{color:var(--muted);transition:color .16s}
.doc-rail a:hover{color:var(--teal-ink)}
.doc-rail .dr-grp{color:var(--ink)}
.doc-rail .dr-ix{border-right:0;margin-left:auto;color:var(--teal-ink)}
@media (max-width:520px){
  .doc-rail span,.doc-rail a{padding:9px 11px;font-size:11px}
  .doc-rail .dr-ix{margin-left:0}
}

/* ═══ Article ════════════════════════════════════════════════════════════ */
.markdown{font-size:16.5px;line-height:1.72;overflow-wrap:anywhere;color:var(--body)}
.markdown>*:first-child{margin-top:0}
.markdown p,.markdown ul,.markdown ol,.markdown blockquote,
.markdown h3,.markdown h4,.markdown h5,.markdown h6{max-width:var(--measure)}
.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{
  font-family:var(--display);color:var(--ink);scroll-margin-top:calc(var(--header-h) + 22px);
}
.markdown h1{
  font-weight:700;font-variation-settings:'wdth' 112;
  font-size:clamp(31px,3.6vw,46px);letter-spacing:-.03em;line-height:1.04;margin:26px 0 .5em;max-width:20ch;
}
/* Every h2 crosses the whole column on a hairline with a teal tick hung on
   its left edge — the ledger rule that gives a long document its rhythm.
   Deliberately not capped to the measure: the rule reads as a section break
   across the column, the heading text itself is never near that long. */
.markdown h2{
  position:relative;font-weight:700;font-variation-settings:'wdth' 108;
  font-size:clamp(21px,2.1vw,27px);letter-spacing:-.022em;line-height:1.22;
  margin:2.7em 0 .8em;padding-top:1.15em;border-top:1px solid var(--line-2);max-width:none;
}
.markdown h2::before{content:"";position:absolute;left:0;top:-1px;width:26px;height:3px;background:var(--teal)}
.markdown h3{font-weight:700;font-variation-settings:'wdth' 104;font-size:19px;letter-spacing:-.014em;margin:2em 0 .5em}
.markdown h4{font-weight:600;font-size:16px;letter-spacing:0;margin:1.7em 0 .4em}
.markdown h5,.markdown h6{font-weight:600;font-size:14.5px;margin:1.5em 0 .4em;color:var(--muted)}
.markdown p{margin:0 0 1.05em}
/* The paragraph directly under the page title is the document's lede. */
.markdown>h1+p{font-size:18.5px;line-height:1.6;color:var(--muted);margin-bottom:1.4em;max-width:64ch}
.markdown ul,.markdown ol{padding-left:1.35em;margin:0 0 1.15em}
.markdown li{margin:.32em 0}
.markdown li::marker{color:var(--line-3)}
.markdown li>ul,.markdown li>ol{margin:.35em 0 .1em}
.markdown a{color:var(--teal-ink);text-decoration:underline;text-decoration-color:var(--teal-edge);text-underline-offset:2px;transition:text-decoration-color .16s}
.markdown a:hover{text-decoration-color:currentColor}
.markdown strong{color:var(--ink);font-weight:650}
/* No white-space:nowrap here on purpose — .markdown's overflow-wrap:anywhere
   has to stay able to break a long inline literal, or a 390px screen gets
   body-level horizontal scroll from a single env-var name. */
.markdown code{font-family:var(--mono);font-size:max(11px,.86em);background:var(--sunk);border:1px solid var(--line);padding:1px 5px;color:var(--ink)}
.markdown hr{border:none;border-top:1px solid var(--line);margin:2.6em 0}
.markdown img{border:1px solid var(--line);margin:1.5em 0}

/* Heading anchor — surfaces the deep link that already works (#slug~anchor)
   without changing how it works. */
.h-anchor{margin-left:.4em;color:var(--line-3);font-weight:400;font-size:max(11px,.62em);opacity:0;text-decoration:none;transition:opacity .15s,color .15s;font-family:var(--mono)}
.markdown h2:hover .h-anchor,.markdown h3:hover .h-anchor,.markdown h4:hover .h-anchor,.h-anchor:focus-visible{opacity:1}
.h-anchor:hover{color:var(--teal-ink)}

/* ── CONTENTS ledger — in-document section index. Shown below 1240px, where
      the ON THIS PAGE rail has no column to live in. A <details> so a phone
      reader is never made to scroll a nineteen-item list to reach §1; it
      opens by default from 760px up, where the two-column ledger costs a
      few lines and pays for itself. */
.contents{
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  margin:1.9em 0 2.4em;max-width:none;
}
@media (min-width:1240px){.contents{display:none}}
.contents>summary{
  display:flex;align-items:center;gap:10px;min-height:46px;padding:0 2px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  list-style:none;
}
.contents>summary::-webkit-details-marker{display:none}
.contents>summary .cs-n{color:var(--teal-ink)}
.contents>summary .cs-r{flex:1;height:1px;background:var(--line)}
.contents>summary .cs-chev{width:14px;height:14px;flex:none;transition:transform .2s}
.contents[open]>summary .cs-chev{transform:rotate(180deg)}
.contents-list{list-style:none;margin:0;padding:0 0 12px;column-gap:34px}
@media (min-width:760px){.contents-list{columns:2}}
.contents-list li{break-inside:avoid}
.contents-list a{
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:baseline;
  min-height:44px;padding:5px 0;color:var(--muted);font-size:14.2px;line-height:1.35;transition:color .16s;
}
.contents-list a:hover{color:var(--ink)}
.contents-list a:hover .cl-n{color:var(--teal-ink)}
.contents-list .cl-n{font-family:var(--mono);font-size:11px;color:var(--faint);transition:color .16s}
@media (max-width:1023px){.contents-list a{min-height:44px;align-items:center}}

/* ── Code fences: a titled instrument panel, not a rounded card ───────────
   The bar names the language and carries a permanently visible COPY (the old
   hover-only button was invisible on every touch device and easy to miss on
   a desktop). The control lives on the WRAPPER, never inside <pre> — inside
   the scroll container it would slide away with the code on a horizontal
   scroll. */
.cb{margin:1.5em 0}
.cb-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;
  padding:0 6px 0 12px;background:var(--hl-bar);border:1px solid var(--hl-line);border-bottom:0;
}
.cb-lang{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--hl-punct)}
.cb-lang::before{content:"";display:inline-block;width:5px;height:5px;background:var(--hl-punct);margin-right:8px;vertical-align:1.5px}
.cb-bar .cb-spacer{flex:1}
/* Only on a fence that really does scroll — see isColumnar() below. It is a
   label, not decoration: a reader who cannot see a scrollbar until they touch
   the block is otherwise never told there is more of the line off to the right. */
.cb-note{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--hl-punct);white-space:nowrap;
}
.cb-copy{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;
  padding:0 10px;background:transparent;border:1px solid transparent;color:var(--hl-fg);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  transition:border-color .16s,color .16s;
}
.cb-copy:hover{border-color:var(--hl-line-2)}
.cb-copy svg{width:12px;height:12px}
.cb-copy.done{color:var(--hl-addition);border-color:var(--hl-addition)}
.cb-copy:focus-visible{outline:2px solid var(--hl-addition);outline-offset:1px}

/* ── CODE WRAPS; IT DOES NOT PAN ──────────────────────────────────────────
   These fences ran to 824px inside a 332px column on a 390px phone. Panning is
   not reading: it hides the left edge of every line you are in the middle of.
   So a code line SOFT-WRAPS by default, with a HANGING INDENT — the
   continuation is set 2.6ch in, so "the rest of the line above" never looks
   like "the next statement".

   That hanging indent is why each source line is its own block (.ln, built by
   wrapCodeLines() below): `text-indent` applies only to the FIRST line box of a
   block, so one <pre> full of newlines cannot express a per-line hanging indent
   at all. The <pre> therefore carries white-space:normal — the newlines BETWEEN
   the .ln blocks have to collapse or everything renders double-spaced — and
   each .ln restores pre-wrap so its own indentation survives.

   The exception is a fence whose columns are load-bearing: a directory tree
   with its comments aligned in a second column stops meaning anything the
   moment it reflows. Those keep white-space:pre and scroll — and say so, in
   the bar, above a scrollbar that is deliberately full-size rather than a
   thin overlay you only discover by touching it. */
.markdown pre{background:var(--hl-bg);border:1px solid var(--hl-line);padding:15px 16px;margin:0;
  white-space:normal;overflow:visible}
.markdown pre code{background:none;border:0;padding:0;font-size:13.2px;line-height:1.7;
  color:var(--hl-fg);white-space:normal;display:block}
.markdown pre .ln{display:block;white-space:pre-wrap;overflow-wrap:break-word;
  padding-left:2.6ch;text-indent:-2.6ch}
.markdown pre .ln:empty::after{content:"\00a0"}

.cb.is-columnar{position:relative}
.cb.is-columnar pre{overflow-x:auto;padding-bottom:4px}
.cb.is-columnar pre .ln{white-space:pre;padding-left:0;text-indent:0}
/* A full-height scrollbar with a track, NOT the thin overlay one — the whole
   point is that the reader can see this block scrolls before they touch it.
   Deliberately no `scrollbar-color`/`scrollbar-width` here: Blink drops every
   ::-webkit-scrollbar rule on an element that sets either standard property,
   which is exactly how this block ended up with an invisible overlay bar. */
.cb.is-columnar pre::-webkit-scrollbar{height:12px}
.cb.is-columnar pre::-webkit-scrollbar-track{background:var(--hl-bar)}
.cb.is-columnar pre::-webkit-scrollbar-thumb{background:var(--hl-line-2);border:2px solid var(--hl-bar)}
/* …and a soft right edge while there is more to come, removed the moment
   there isn't, so it never lies about how much is left.
   Absolutely positioned rather than an in-flow sibling: an in-flow box paints
   its background in the backgrounds phase, i.e. UNDER the text of everything
   beside it, so a fade laid out next to the code is painted and then covered
   completely by the very code it exists to fade out. It runs the full height
   of the frame and the title bar is lifted above it, so the fade stays tied to
   the frame's own edges rather than to a bar height that can change. */
.cb.is-columnar .cb-bar{position:relative;z-index:2}
.cb.is-columnar.has-more::after{
  content:"";position:absolute;top:1px;right:1px;bottom:1px;width:42px;
  z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(12,17,22,0),var(--hl-bg));
}

/* highlight.js token colors — see --hl-* in :root; the code surface is
   fixed-dark in both page themes so one set of values covers both.
   Bucket inventory (every hljs-* class the vendored build emits for the
   languages these docs use — go, bash, json/jsonc, python, javascript,
   typescript, http, yaml, rust, ruby, php, java, kotlin, csharp, cpp, c,
   swift, elixir, dart, r — verified by rendering real doc pages plus
   synthetic snippets per language and diffing the DOM):
     comment    -> comment, quote
     keyword    -> keyword, type (storage/type names — go `string`/`int`,
                   rust/java/ts generics, python `Optional`), selector-tag,
                   variable.language_ (this/self/$this/console — reads like
                   a reserved word, not a user variable)
     string     -> string, doctag, regexp
     number     -> number, literal (true/false/null/True/None/nil/NULL),
                   variable.constant_ (JS `static X =`, PHP class consts —
                   these are specifically called out as "constants" in the
                   number/amber bucket, not the variable/rose one)
     function   -> title (covers the bare class plus every compound variant —
                   title.function_, title.class_, title.class_.inherited__,
                   title.function_.invoke__ — since class/struct/interface
                   names share this bucket with function/method names; the
                   modifier suffix never appears without the base class),
                   section
     property   -> attr (JSON/YAML keys, JS/TS object keys), attribute
                   (HTTP header names — the http grammar uses hljs-attribute,
                   not hljs-attr, for these; both land in the same bucket),
                   params, property (JS/TS member-access chains)
     variable   -> variable, template-variable, name, symbol (ruby/elixir
                   :atoms), selector-class/attr/pseudo, link
     meta       -> meta (bash shebang, PHP `<?php`, C/C++ preprocessor),
                   built_in (go len/panic, python str/print, bash
                   export/local/echo — deliberately NOT the same bucket as
                   plain variables), tag
     punctuation-> punctuation, operator (java/swift/r casts and comparisons
                   — punctuation's row explicitly covers "operators"),
                   bullet (yaml `-` list markers), selector-id
   hljs-subst (the `${...}` / `#{...}` interpolation markers inside template
   strings) is deliberately set to plain default text rather than the string
   color, so interpolated code reads as code, not as string content — this
   is what stops an f-string/template literal from visually "swallowing"
   the variable inside it.
   hljs-class and hljs-function are the *wrapper* spans some grammars put
   around a whole `class Foo …` / `func bar(…)` declaration. They are listed
   FIRST below, and given the punctuation color, deliberately: their inner
   tokens (keyword, title, params) all re-color themselves in the rules that
   follow — equal specificity, later in the source, so those win — while the
   text the wrapper holds DIRECTLY is exactly the declaration's own unscoped
   punctuation. In the C example on client-examples that is the `*` of
   `struct curl_slist *h =` and the `=` beside it, which used to fall through
   to the default text color; nothing in a code fence should be default-colored
   for lack of a rule.
   Go's struct-field access (`res.Choices[0].Message`) and bare function
   calls (`fmt.Println`) are verified NOT to be scoped by this hljs build's
   go grammar at all — they render as default text by design, not as a
   fallthrough bug. */
.hljs-class,.hljs-function{color:var(--hl-punct)}
.hljs-comment,.hljs-quote{color:var(--hl-comment);font-style:italic}
.hljs-keyword,.hljs-type,.hljs-selector-tag,.hljs-variable.language_{color:var(--hl-keyword)}
.hljs-string,.hljs-doctag,.hljs-regexp{color:var(--hl-string)}
.hljs-number,.hljs-literal,.hljs-variable.constant_{color:var(--hl-number)}
.hljs-title,.hljs-section{color:var(--hl-function)}
.hljs-attr,.hljs-attribute,.hljs-params,.hljs-property{color:var(--hl-property)}
.hljs-variable,.hljs-template-variable,.hljs-name,.hljs-symbol,.hljs-selector-class,.hljs-selector-attr,.hljs-selector-pseudo,.hljs-link{color:var(--hl-variable)}
.hljs-meta,.hljs-built_in,.hljs-tag{color:var(--hl-meta)}
.hljs-punctuation,.hljs-operator,.hljs-bullet,.hljs-selector-id{color:var(--hl-punct)}
.hljs-subst{color:var(--hl-fg)}
.hljs-deletion{color:var(--hl-deletion)}
.hljs-addition{color:var(--hl-addition)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:700}

/* ── Notes: a teal-edged panel, the landing's "permitted" edge ── */
.markdown blockquote{
  margin:1.6em 0;padding:14px 18px;background:var(--panel);
  border:1px solid var(--line);border-left:2px solid var(--teal);color:var(--body);font-size:15.6px;
}
.markdown blockquote p:last-child{margin-bottom:0}

/* ── Tables: a hairline grid with a mono head ─────────────────────────────
   Tables scroll inside their own wrapper (added by wrapTables() below), not
   by being display:block themselves — a block-level table with a min-width is
   the box that overflows, and that is body-level horizontal scroll. The
   wrapper is the scroll container; the table inside it can be as wide as it
   needs. */
.table-wrap{overflow-x:auto;max-width:100%;margin:1.6em 0;scrollbar-width:thin;scrollbar-color:var(--line-3) transparent}
.table-wrap::-webkit-scrollbar{height:8px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--line-3)}
.markdown table{border-collapse:collapse;width:100%;max-width:100%;margin:1.6em 0;font-size:14.2px;display:block;overflow:auto}
.table-wrap>table{display:table;margin:0;overflow:visible}
/* Cells opt out of .markdown's overflow-wrap:anywhere: inside a table that
   rule shrank the column to a single character and split `/v1/chat/completions`
   across two lines mid-token. break-word keeps prose words whole.
   The one exception is an inline literal. `anywhere` (unlike `break-word`) also
   lowers a box's MIN-CONTENT width, so scoping it to <code> is what lets a
   table whose cells contain things like `LLMUX_URL=http://127.0.0.1:4000` fit
   its column instead of forcing the whole table into a horizontal scroll —
   without ever letting an ordinary sentence break mid-word. */
.markdown th,.markdown td{border:1px solid var(--line);padding:10px 13px;text-align:left;vertical-align:top;overflow-wrap:break-word}
.markdown th code,.markdown td code{overflow-wrap:anywhere}
.markdown th{
  background:var(--panel);border-color:var(--line-2);color:var(--faint);
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
}
.markdown td{color:var(--body)}
.markdown tbody tr:nth-child(even){background:var(--tint)}

/* ── Narrow: a table becomes a stack of records, not a drag ───────────────
   Same move the landing's endpoint matrix makes, for the same reason: a
   multi-column table cannot be squeezed into a 332px column, and the
   alternative — the whole table inside a horizontal scroller — makes the
   reader drag every row sideways to read the columns they came for. Below
   640px each row becomes a record and each cell is introduced by its own
   column heading, carried on the cell as data-h by wrapTables(). The <thead>
   is clipped, never display:none, so it stays the table's column headers in
   the accessibility tree. */
@media (max-width:640px){
  .table-wrap{overflow-x:visible}
  .markdown .table-wrap>table{display:block;margin:0}
  .markdown thead{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .markdown tbody{display:block}
  .markdown tbody tr,.markdown tbody tr:nth-child(even){
    display:flex;flex-direction:column;border:1px solid var(--line-2);background:var(--panel);
    padding:4px 13px 10px;margin-bottom:10px}
  .markdown tbody tr:last-child{margin-bottom:0}
  .markdown td{display:block;border:0;padding:7px 0 0}
  .markdown td[data-h]::before{
    content:attr(data-h);display:block;margin-bottom:3px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);
  }
  /* An empty cell in a record would otherwise be a heading with nothing under
     it; markdown tables are full of them. */
  .markdown td:empty{display:none}
}

/* mermaid.initialize() below always renders with theme:'dark' (its node
   fills/edge-label chips assume a dark surface under them) — so, exactly like
   the fixed-dark code surface above, the container has to stay dark in BOTH
   page themes. Leaving this on a themed panel (white in light mode) was a real
   bug: dark-on-dark edge labels ("yes"/"no") and the subgraph title read as
   barely-there grey-on-grey against a white box. */
.markdown .mermaid{background:var(--hl-bg);border:1px solid var(--hl-line);border-top:0;padding:20px;margin:0;text-align:center;overflow:auto}
.cb.is-diagram{margin:1.6em 0}

/* ── Language picker ──────────────────────────────────────────────────────
   Replaces a run of N>=3 consecutive per-language code blocks (see
   buildLangPickers() below) with a tab strip + one visible panel. The strip
   scrolls horizontally on its own; it never widens the page. Inside a picker
   the tab strip IS the fence's title bar, so the per-fence language label is
   suppressed and only COPY remains. */
.lang-picker{margin:1.6em 0}
/* Seventeen languages will not fit any column, so the strip scrolls on its own
   rather than widening the page. It is a CONTROL strip, not prose — the rule
   that code must wrap instead of pan does not apply to it — but the reader
   still has to be told there are tabs off the edge, so it gets the same honest
   treatment the columnar code fences get: a soft edge on whichever side has
   more, and nothing at all on a side that has run out. buildLangPickers() also
   scrolls the live tab into view, so a restored preference like Rust is never
   selected somewhere the reader cannot see. */
.lang-strip{position:relative}
.lang-tabs{
  display:flex;gap:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line-2);background:var(--panel);
}
.lang-tabs::-webkit-scrollbar{height:8px}
.lang-tabs::-webkit-scrollbar-track{background:var(--tint)}
.lang-tabs::-webkit-scrollbar-thumb{background:var(--line-3)}
.lang-strip::before,.lang-strip::after{
  content:"";position:absolute;top:1px;bottom:1px;width:34px;pointer-events:none;
  opacity:0;transition:opacity .16s;z-index:1;
}
.lang-strip::before{left:1px;background:linear-gradient(90deg,var(--panel),rgba(0,0,0,0))}
.lang-strip::after{right:1px;background:linear-gradient(270deg,var(--panel),rgba(0,0,0,0))}
.lang-strip.more-l::before,.lang-strip.more-r::after{opacity:1}
.lang-tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 13px;margin:0;
  border:0;border-right:1px solid var(--line);border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-family:var(--mono);font-size:11.6px;letter-spacing:.05em;line-height:1;cursor:pointer;
  transition:color .16s,background .16s,border-color .16s;white-space:nowrap;
}
.lang-tab:hover{color:var(--ink);background:var(--tint)}
.lang-tab[aria-selected="true"]{color:var(--ink);background:var(--canvas);border-bottom-color:var(--teal)}
.lang-tab:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.lang-tab-icon{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;padding:1px 4px;border:1px solid currentColor;
  font-family:var(--mono);font-size:11px;font-weight:500;line-height:1.35;
  letter-spacing:0;opacity:.72;
}
.lang-tab[aria-selected="true"] .lang-tab-icon{opacity:1;border-color:var(--teal-edge);color:var(--teal-ink)}
.lang-panels{margin-top:0}
.lang-panel{display:none}
.lang-panel.active{display:block}
.lang-panel>p{margin:14px 0 8px;color:var(--body);max-width:var(--measure)}
.lang-panel>p:first-child strong{color:var(--ink)}
.lang-panel>.cb{margin:0}
.lang-panel .cb-lang{display:none}
@media (max-width:1023px){.lang-tab{min-height:46px}}
/* Markdown task-list boxes. marked renders them `disabled`, so they are not
   controls at all — but a 13px UA box next to 16.5px text just reads as a
   rendering accident, so they get drawn at the size of the text they mark. */
.markdown input[type=checkbox]{width:16px;height:16px;margin:0 .5em 0 0;vertical-align:-2px;accent-color:var(--teal)}

/* ═══ Prev / next — a linear path through thirteen documents ══════════════ */
.doc-foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-2);margin:70px 0 0}
.doc-foot a{display:block;padding:20px 0;transition:background .16s}
.doc-foot a:hover{background:var(--tint)}
.doc-foot .prev{padding-right:20px}
.doc-foot .next{grid-column:2;text-align:right;border-left:1px solid var(--line);padding-left:20px}
.doc-foot .dir{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.doc-foot .t{display:block;margin-top:7px;font-family:var(--display);font-variation-settings:'wdth' 104;font-weight:600;font-size:17px;line-height:1.25;color:var(--ink)}
.doc-foot a:hover .t{color:var(--teal-ink)}
@media (max-width:600px){
  .doc-foot{grid-template-columns:1fr}
  .doc-foot .next{grid-column:1;text-align:left;border-left:0;border-top:1px solid var(--line);padding-left:0}
  .doc-foot .prev{padding-right:0}
}

.docs-error{color:var(--rust);background:var(--rust-wash);border:1px solid var(--rust-edge);padding:14px 16px}
.doc-loading{color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.08em}
/* No-JS fallback. Nothing can render the markdown, so the "Loading…" line is
   dropped and the thirteen source files are offered instead. The rules that
   HIDE the JS-only chrome live in a <style> inside the <noscript> itself —
   that block only exists at all when scripting is off, which is exactly the
   condition they are meant to apply under. */
.ns-docs{padding-top:26px;counter-reset:nsd}
.ns-list{list-style:none;margin:1.4em 0 0;padding:0;border-top:1px solid var(--line-2)}
.ns-list li{counter-increment:nsd;border-bottom:1px solid var(--line)}
.ns-list a{display:flex;align-items:center;gap:12px;min-height:52px;color:var(--ink);
  text-decoration:none;font-size:15.5px}
.ns-list a::before{content:counter(nsd,decimal-leading-zero);font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;color:var(--teal-ink)}
.ns-list a:hover{color:var(--teal-ink)}

/* ═══ Footer ═════════════════════════════════════════════════════════════ */
.site-footer{border-top:1px solid var(--line);padding:26px 0 34px;margin-top:20px}
@media (max-width:1023px){.site-footer{margin-top:0}}

/* ── Vulos suite chrome — identical on every product landing ───────────────
   Two elements, and only two: a logo-only home button in the top bar, and
   one line in the footer. Deliberately free of repo variables so the block
   is byte-identical across the suite and can be diffed as one thing. */
.vulos-home { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; opacity: .72; transition: opacity .15s ease, transform .15s ease; }
.vulos-home:hover, .vulos-home:focus-visible { opacity: 1; transform: translateY(-1px); }
.vulos-home img { display: block; width: 22px; height: 22px; border-radius: 6px; }
.vulos-foot { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; line-height: 1.45; text-decoration: none; color: inherit; opacity: .85; transition: opacity .15s ease; }
.vulos-foot:hover { opacity: 1; text-decoration: none; }
.vulos-foot img { display: block; width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto; }

/* Hit area for the two suite-chrome controls. Deliberately written OUTSIDE the
   block above so that block stays byte-identical across the suite and can still
   be diffed as one thing. Only the TARGET grows to the 44px floor; both marks
   keep their drawn size, because what is actually visible in each is the 22px
   and 18px <img> inside, not the transparent box around it. */
.vulos-home{width:44px;height:44px}
.vulos-foot{min-height:44px}
</style>
