name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Enables the gated Postgres/Redis integration tests in CI.
      LLMUX_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/llmux_test?sslmode=disable
      LLMUX_TEST_REDIS: localhost:6379
      # The service containers above are guaranteed here, so a SKIP means they
      # failed to come up. Without this, such a run goes green with zero
      # cross-replica coverage. With it, the gated corpus must actually execute.
      LLMUX_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      # The admin console (web/ui.html) is a single hand-written HTML file
      # with inline CSS/JS, embedded via go:embed — no npm, no bundler, no
      # committed build artifact, no Node step needed anywhere in CI. Its
      # structural properties (present, non-trivial size, references no
      # external origin) are asserted by web/embed_test.go, which runs as
      # part of `go test` below like any other package.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # This used to be `test -z "$(gofmt -l core cmd sdks web site)"`. That
      # hand-written directory list silently excluded `integration/` — proven by
      # planting an unformatted file there and watching CI stay green — and it
      # would go blind again the next time a top-level Go directory is added.
      # The script DISCOVERS every directory holding first-party Go source,
      # asserts a coverage floor on what it found (so a broken scan fails
      # instead of passing vacuously), prints the scope it verified, and asserts
      # `integration/` by name so this exact hole cannot silently reopen.
      - name: gofmt check (every Go directory)
        run: ./scripts/gofmt-check.sh

      - name: Test
        run: go test -race -cover -timeout 180s ./...

      # The site is static, self-contained and makes NO outbound requests —
      # that claim is load-bearing (a sibling product shipped an external
      # iframe and silently broke the same claim), and review does not catch
      # it. This asserts it, plus the two ratified chrome rules that have
      # regressed before: docs pages carry no footer, and the docs rail is
      # pinned with the shell packed left. It also proves every fenced
      # language in docs/ is in the VENDORED highlight.js build, so a new
      # SDK page cannot ship a code block that renders as grey plaintext.
      #
      # The selftest runs too, and is not optional: it breaks each assertion
      # in a throwaway copy of the tree and requires the gate to fail, then
      # restores. Without it, "check-docs-chrome: PASS" is a line of text.
      - name: Site chrome (no footer, pinned rail, no outbound origins, vendored languages)
        run: node scripts/check-docs-chrome.mjs

      - name: Prove the site-chrome gate still fails when its assertions are broken
        run: node scripts/check-docs-chrome.test.mjs

      # Every package manifest under sdks/ must declare the version in
      # /VERSION. They were checked by nobody until now, and it showed: llmux
      # shipped 0.1.7 with all six of its literal-carrying manifests still at
      # 0.1.0, openrate shipped 0.1.8 with its Rust crate at 0.1.0. A manifest
      # that lies about its version is what a registry, a lockfile and a
      # consumer's resolver all believe.
      #
      # --selftest first: it drifts a manifest, drifts a lockfile, deletes a
      # version field and adds an unlisted SDK, and requires each to be
      # refused. It mutates the real tree and restores it, because a copy would
      # not prove it reads the tree that ships.
      - name: SDK manifests all declare the released version
        run: |
          node scripts/check-sdk-versions.mjs --selftest
          node scripts/check-sdk-versions.mjs

      # The admin console is optional: `-tags noui` drops the go:embed and
      # core/server mounts a JSON stub instead. Only ONE tag state is exercised
      # by the steps above, so without this the untagged build could rot for a
      # release cycle before anyone noticed. Build, vet and test it — a build
      # alone would not catch the stub answering the wrong status.
      - name: Build/vet/test without the admin console (-tags noui)
        run: |
          go build -tags noui ./...
          go vet -tags noui ./...
          go test -tags noui -timeout 180s ./...

  # embedtest/ is llmux's embeddability suite: it proves, from OUTSIDE the
  # module, that core/gateway is usable as a library. It is a SEPARATE Go
  # module (path github.com/vul-os/llmux-embedtest, deliberately outside the
  # library's import-path prefix — see embedtest/doc.go), so the `go test ./...`
  # in the `ci` job above does not descend into it and none of this would ever
  # run without its own job.
  #
  # Everything here goes through scripts/go-test-gate.sh rather than plain
  # `go test`, because `go test` exits 0 when every package reports
  # [no test files] — the exact false green a nested module invites.
  embeddability:
    name: Embeddability guards (embedtest module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ShellCheck the test gate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash -n scripts/go-test-gate.sh
          shellcheck scripts/go-test-gate.sh

      - name: Vet the embedtest module
        run: go vet ./...
        working-directory: embedtest

      # --min is a floor on top-level tests that actually ran and passed (15 at
      # the time of writing). Each --require names a guard whose disappearance
      # must be a red build rather than a quieter run: the module wall the whole
      # suite rests on, the zero-round-trip and zero-goroutine counts, the
      # unnamed-provider-key check, the import-direction check, the no-UI-bytes
      # scan and the noui size delta.
      - name: Embeddability guards
        run: |
          ./scripts/go-test-gate.sh --dir embedtest --min 15 \
            --require TestInternalWallRefusesAnInternalImport \
            --require TestModulePathSitsOutsideTheLibraryPrefix \
            --require TestLibraryChatThroughPublicAPI \
            --require TestConstructionStartsNoGoroutines \
            --require TestConstructionMakesZeroRoundTrips \
            --require TestConstructionAdoptsNoUnnamedProviderKey \
            --require TestGatewayDependsOnNeitherServerNorUI \
            --require TestLibraryOnlyHostLinksNoUIBytes \
            --require TestNoUIBuildDropsTheEmbedAndIsSmaller \
            --require TestBothBuildStatesServeTheDocumentedUIResponse \
            -- -count=1 ./...

      # Exercise the gate's own refusal, in the spirit of the verify-script job
      # above: run it against a package that HAS no tests and require it to
      # fail. A gate that has quietly stopped failing is indistinguishable, from
      # a green run, from one that works.
      - name: Prove the gate still refuses a run that verified nothing
        run: |
          if ./scripts/go-test-gate.sh --dir embedtest --min 1 -- ./hosts/libonly; then
            echo "::error::go-test-gate passed on a package with no tests — it is not a gate"
            exit 1
          fi
          echo "go-test-gate correctly refused a run in which zero tests executed"

  # ffi/ is the C-ABI shared library: the same gateway, loadable in-process by
  # any language that can dlopen. It is a SEPARATE Go module (path
  # github.com/vul-os/llmux-ffi, deliberately outside the library's
  # import-path prefix — see ffi/doc.go), so neither `go test ./...` nor the
  # embeddability job above descends into it, and it needs cgo, which the
  # pure-Go jobs above deliberately do not use.
  #
  # The C smoke test is the load-bearing step. Every Go test in ffi/ would pass
  # just as happily with a missing //export, a renamed symbol, or a header that
  # no longer matches the library; only a program that dlopens the built
  # artifact and calls it through ffi/include/llmux.h can catch that.
  ffi:
    name: C ABI (ffi module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ShellCheck the ffi scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash -n scripts/build-ffi.sh scripts/ffi-ctest.sh
          shellcheck scripts/build-ffi.sh scripts/ffi-ctest.sh

      - name: Vet the ffi module
        run: go vet ./...
        working-directory: ffi

      # Gated, not plain `go test`: ffi/ is a nested module, and `go test` exits
      # 0 when every package reports [no test files] — the exact false green a
      # nested module invites. --require names the guards whose disappearance
      # must be a red build: the version probe that makes a stale .so
      # detectable, the import-path wall that keeps the C ABI honest about
      # using only the public API, and the streaming behaviour that is the
      # whole reason this layer exists.
      - name: ABI unit tests (gated)
        run: |
          ./scripts/go-test-gate.sh --dir ffi --min 14 \
            --require TestABIVersionMatchesThePackageVersion \
            --require TestFFIUsesOnlyThePublicAPI \
            --require TestUnknownHandleIsACleanError \
            --require TestCloseIsIdempotentAndHandlesAreNotReused \
            --require TestChatCallReturnsTheHTTPAPIsJSON \
            --require TestStreamDeliversChunksThatReassembleTheAnswer \
            --require TestStreamAbortFromTheCallbackIsNotAnError \
            --require TestTwoHandlesAreIndependent \
            -- -count=1 ./...

      # Builds libllmux.so, starts the fake upstream, compiles ctest/smoke.c
      # against the stable header and runs it. The C test asserts how many of
      # its own checks executed, so an early exit is a failure rather than a
      # short green run.
      - name: C smoke test (dlopen the built library)
        run: ./scripts/ffi-ctest.sh --selftest

      # The C ABI must not leak cgo into the main module. The `ci` job builds
      # with the runner's default (CGO_ENABLED=1); this proves the pure-Go
      # build is still pure — the property embedtest/ and every non-cgo
      # consumer depend on.
      - name: The main module still builds with cgo OFF
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go build -tags noui ./...

      # Honest reporting, in CI's own log: which targets a Linux runner can
      # actually produce. Not a gate — the host build above already is one.
      - name: Report which shared-library targets this runner can build
        run: ./scripts/build-ffi.sh --all || true

  # sdks/node is the only package.json in the tree with a `typescript`
  # dependency. Go build/test above never touch it — without this job the TS
  # SDK's type-aware ESLint config (strictTypeChecked) and `tsc --noEmit`
  # never actually ran in CI, so a real type error or a de-fanged lint config
  # would still go green.
  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json

      - run: npm ci

      - name: Lint (type-aware ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the CI gate script itself (scripts/check-lint-config.mjs)
        run: npm run typecheck:scripts

      - name: Prove the lint config is actually type-aware, not just named that way
        run: npm run check:lint-config

      - name: Build
        run: npm run build

      # index.js, index.d.ts, direct.js and direct.d.ts are COMMITTED — they
      # are the package's entry point and types, and committing them is what
      # makes `npm pack` work from a clean checkout (openrate did neither and
      # its pack produced a tarball of two files, neither of which was code).
      #
      # The cost of that choice is drift: nothing stopped the committed
      # JavaScript from falling behind the TypeScript beside it, and a stale
      # entry point is invisible here because the step above rebuilds it before
      # the tests run. The rebuild is now required to change nothing.
      - name: The committed build output is what the TypeScript produces
        run: |
          if ! git diff --exit-code -- . ; then
            echo "::error::the committed JS/d.ts under sdks/node is stale — run 'npm run build' and commit the result"
            exit 1
          fi

  # sdks/rust is a real crate (Cargo.toml + src/ + tests/) that neither the Go
  # build/test above nor the Node SDK job touches — without this job `cargo
  # build`, `cargo test`, and `cargo clippy -D warnings` never actually ran in
  # CI, so a broken build or a real clippy lint would still go green. Built
  # with --all-features so the optional `async-openai` codepath (normally
  # invisible to a default-features build) is actually compiled and linted
  # too, not just declared in Cargo.toml. `cargo fmt` is deliberately not a
  # gate here.
  rust-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

  # Optional live-provider smoke (real keys via repo secrets). Skips gracefully
  # if secrets are absent.
  live:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Live smoke
        env:
          LLMUX_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -count=1 -run Live ./... || true

  rendered-contrast:
    name: Text contrast measured from composited pixels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright is not vendored: this repo ships no npm tree and no
      # lockfile, and the site is plain HTML/CSS with no build step. It is
      # installed here, for this job only, and --no-save keeps it out of the
      # checkout.
      - name: Install Playwright (chromium only)
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright@1
          npx --yes playwright install --with-deps chromium

      # There is no token-reading contrast gate in this repo to complement, so
      # this one is the whole of it — which is also why it has to measure the
      # pixels rather than the stylesheet. It found `.lang-tab-icon` sitting at
      # opacity:.72, which put the language codes in the docs tab strip (py,
      # js, go, rs …) at 3.67:1 in light theme. Nothing in any colour VALUE was
      # wrong, so nothing that reads values could have found it.
      #
      # --selftest first: eight deliberate breakages, each required to be
      # refused, plus a positive control — a gate that refuses everything
      # refuses every mutation too.
      - name: Every visible string clears WCAG AA, composited
        run: |
          node scripts/check-contrast-rendered.mjs --selftest
          node scripts/check-contrast-rendered.mjs
