name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Enables the gated Postgres/Redis integration tests in CI.
      LLMUX_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/llmux_test?sslmode=disable
      LLMUX_TEST_REDIS: localhost:6379
      # The service containers above are guaranteed here, so a SKIP means they
      # failed to come up. Without this, such a run goes green with zero
      # cross-replica coverage. With it, the gated corpus must actually execute.
      LLMUX_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build embedded web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # The bundle we just built is embedded into the gateway binary and served
      # at /ui. A bundle that BUILDS but does not RUN is a blank screen for every
      # user — `vite build` cannot see that, only a real browser can. Boot it in
      # chromium and fail on any uncaught exception / empty root. This also walks
      # the React.lazy() /docs and /app chunks, whose defects do not exist until
      # their route is visited.
      - name: Install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # `npm test` → pretest:e2e (vite build) → playwright test
      - name: Web boot guard + E2E
        working-directory: web
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llmux-playwright-report
          path: web/playwright-report/
          retention-days: 7

      # web/dist is COMMITTED and compiled into the binary by web/embed.go's
      # go:embed, so the UI a user runs is the bundle in git — NOT the one the
      # step above just built. Edit web/src (or web/docs, which Docs.jsx imports
      # with ?raw) and forget to rebuild, and every release ships the previous
      # UI while every other check stays green. That is not hypothetical: commit
      # 630177c changed web/src and dist was not rebuilt until 2ec6674, two
      # commits later.
      #
      # The gate rebuilds and compares content hashes; it fails closed (no npm,
      # no bundle, no repo root => failure) and asserts coverage floors so an
      # empty dist/ cannot register as "no differences found". See the header of
      # the script for how it differs from the openrate gate it was adapted from.
      - name: Committed web/dist matches a fresh build of web/src
        run: ./scripts/check-web-dist.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # This used to be `test -z "$(gofmt -l core cmd sdks web site)"`. That
      # hand-written directory list silently excluded `integration/` — proven by
      # planting an unformatted file there and watching CI stay green — and it
      # would go blind again the next time a top-level Go directory is added.
      # The script DISCOVERS every directory holding first-party Go source,
      # asserts a coverage floor on what it found (so a broken scan fails
      # instead of passing vacuously), prints the scope it verified, and asserts
      # `integration/` by name so this exact hole cannot silently reopen.
      - name: gofmt check (every Go directory)
        run: ./scripts/gofmt-check.sh

      - name: Test
        run: go test -race -cover -timeout 180s ./...

  # Optional live-provider smoke (real keys via repo secrets). Skips gracefully
  # if secrets are absent.
  live:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Live smoke
        env:
          LLMUX_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -count=1 -run Live ./... || true
