name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Enables the gated Postgres/Redis integration tests in CI.
      LLMUX_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/llmux_test?sslmode=disable
      LLMUX_TEST_REDIS: localhost:6379
      # The service containers above are guaranteed here, so a SKIP means they
      # failed to come up. Without this, such a run goes green with zero
      # cross-replica coverage. With it, the gated corpus must actually execute.
      LLMUX_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      # The admin console (web/ui.html) is a single hand-written HTML file
      # with inline CSS/JS, embedded via go:embed — no npm, no bundler, no
      # committed build artifact, no Node step needed anywhere in CI. Its
      # structural properties (present, non-trivial size, references no
      # external origin) are asserted by web/embed_test.go, which runs as
      # part of `go test` below like any other package.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # This used to be `test -z "$(gofmt -l core cmd sdks web site)"`. That
      # hand-written directory list silently excluded `integration/` — proven by
      # planting an unformatted file there and watching CI stay green — and it
      # would go blind again the next time a top-level Go directory is added.
      # The script DISCOVERS every directory holding first-party Go source,
      # asserts a coverage floor on what it found (so a broken scan fails
      # instead of passing vacuously), prints the scope it verified, and asserts
      # `integration/` by name so this exact hole cannot silently reopen.
      - name: gofmt check (every Go directory)
        run: ./scripts/gofmt-check.sh

      - name: Test
        run: go test -race -cover -timeout 180s ./...

      # The admin console is optional: `-tags noui` drops the go:embed and
      # core/server mounts a JSON stub instead. Only ONE tag state is exercised
      # by the steps above, so without this the untagged build could rot for a
      # release cycle before anyone noticed. Build, vet and test it — a build
      # alone would not catch the stub answering the wrong status.
      - name: Build/vet/test without the admin console (-tags noui)
        run: |
          go build -tags noui ./...
          go vet -tags noui ./...
          go test -tags noui -timeout 180s ./...

  # sdks/node is the only package.json in the tree with a `typescript`
  # dependency. Go build/test above never touch it — without this job the TS
  # SDK's type-aware ESLint config (strictTypeChecked) and `tsc --noEmit`
  # never actually ran in CI, so a real type error or a de-fanged lint config
  # would still go green.
  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json

      - run: npm ci

      - name: Lint (type-aware ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the CI gate script itself (scripts/check-lint-config.mjs)
        run: npm run typecheck:scripts

      - name: Prove the lint config is actually type-aware, not just named that way
        run: npm run check:lint-config

      - name: Build
        run: npm run build

  # sdks/rust is a real crate (Cargo.toml + src/ + tests/) that neither the Go
  # build/test above nor the Node SDK job touches — without this job `cargo
  # build`, `cargo test`, and `cargo clippy -D warnings` never actually ran in
  # CI, so a broken build or a real clippy lint would still go green. Built
  # with --all-features so the optional `async-openai` codepath (normally
  # invisible to a default-features build) is actually compiled and linted
  # too, not just declared in Cargo.toml. `cargo fmt` is deliberately not a
  # gate here.
  rust-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

  # Optional live-provider smoke (real keys via repo secrets). Skips gracefully
  # if secrets are absent.
  live:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Live smoke
        env:
          LLMUX_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -count=1 -run Live ./... || true
